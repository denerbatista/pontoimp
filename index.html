const hDec=(y)=>{ const m=Math.round(Math.abs(+y||0)*60); return (y<0?'−':'')+hm(m); };

function linhaCartao(d,{comprovante=true}={}){
  const sit={0:'✅',1:'⚠️',2:'⛔'}[d.situacao]||'';
  const bats=(d.batidas||[]).filter(b=>b&&(b.valor||b.nome));
  const chips=bats.map((b,i)=>{
    const mudou=b.valorOriginal!=null&&b.valorOriginal!==b.valor;
    const geo=b.geolocalizacao&&b.geolocalizacao.latitude!=null
      ?`<a href="https://maps.google.com/?q=${b.geolocalizacao.latitude},${b.geolocalizacao.longitude}" target="_blank" title="${esc(b.geolocalizacao.endereco||'Endereço não disponível')}">📍</a>`:'';
    const comp=(comprovante&&b.ehRepP&&b.valor&&d.id!=null)
      ?` <a href="#" onclick="event.preventDefault();comprovanteBatida(${+d.id},'${encodeURIComponent(b.nome||'').replace(/'/g,'%27')}')" title="Comprovante">🧾</a>`:'';
    return `<div class="chip"><small>${esc(b.nome||('Batida '+(i+1)))}${mudou?' ✏️':''}</small><b>${esc(b.valor||'—')}</b> ${geo}${comp}</div>`;
  }).join('');
  const vals=(d.valores||[]).filter(v=>v&&v.valor).map(v=>
    `<div class="detLinha"><span>${esc(v.nome)}</span><b>${esc(v.valor)}</b></div>`).join('');
  const saldo=d.saldo&&!['+00:00','00,00','00:00'].includes(d.saldo)?`<span class="pill ${String(d.saldo).startsWith('-')?'warn':'bad'}">${esc(d.saldo)}</span>`:'';
  const dt=String(d.data||'').slice(0,10), dia=dt?new Date(dt+'T12:00:00'):null;
  return `<div class="dia">
    <div class="diaHead"><b style="${dia&&dia.getDay()===0?'color:var(--bad)':''}">${d.funcionarioNome?esc(d.funcionarioNome)+' · ':''}${dia?['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'][dia.getDay()]+' '+dataSec(dt):'—'}${d.feriado?' - Fer':''}</b>
      <span style="margin-left:6px">${sit}${d.registroPendente?' ⏳':''}</span><span style="flex:1"></span>${saldo}</div>
    ${chips?`<div class="batChips">${chips}</div>`:''}
    ${d.registroPendente?'<p class="muted" style="font-size:12px;margin:6px 0 0">Existem inclusões de ponto em processamento neste dia.</p>':''}
    ${d.existePeriodoEncerrado?'<p class="muted" style="font-size:12px;margin:6px 0 0">Período encerrado — não dá mais pra ajustar nem justificar.</p>':''}
    ${vals?`<div class="detDia">${vals}</div>`:''}
  </div>`;
}
function comprovanteBatida(id,nome){

function totaisCartao(d){
  const t=(d&&d.totais)||[];
  return t.length?`<div class="metaSub" style="margin:0 0 8px;border:0;padding:0">${t.filter(x=>x&&x.valor)

}
/* PDF do cartão: o app grava as opções e depois abre o relatório pela URL
   com axpw. As colunas seguem o montarColunasImpressao: pares de batida e
   as colunas de cálculo que vieram no espelho. */
async function imprimirCartao(ini,fim,dados,fid){
  const l=(dados&&dados.lista)||[];
  const pares=Math.max(1,Math.ceil(Math.max(0,...l.map(d=>(d.batidas||[]).length))/2));
  const colunas=[];
  for(let i=1;i<=pares;i++) colunas.push('Entrada '+i,'Saída '+i);
  ((l[0]&&l[0].valores)||[]).forEach(v=>v&&v.nome&&colunas.push(v.nome));
  const id=fid||S.func.id;
  await secJson('POST','/RelatorioCartaoPonto',{ exibirEventos:false, exibirMiniaturaDoHorario:false,
    exibirTermosMTB:false, exibirTotaisNoRodape:false, modoPaisagem:false, exibirJustificativas:false,
    exibirJustificativasInclusaoPonto:false, justificativasPreenchidasUsuario:false,
    exibirLegendasJustificativas:false, exibirAtividades:false,
    ...((dados&&dados.opcoesCartaoPonto)||{}), colunasSelecionadasImpressao:colunas, funcionarioId:id });
  await secArquivo(`/RelatorioCartaoPonto?axpw={axpw}&dataInicio=${ini}&dataFim=${fim}&funcionarioId=${fid?fid:'{funcionarioId}'}`,
    `cartao-ponto-${ini}-${fim}.pdf`);
}
function telaCartao(s,st,{gestor=false}={}){
  const funcs=gestor?`<div class="field"><label>Funcionário</label><select onchange="M['${s}'].fid=+this.value;recarregar('${s}')">
    <option value="">— escolha —</option>${(st.funcs||[]).map(f=>`<option value="${f.id}" ${st.fid===f.id?'selected':''}>${esc(f.nome)}</option>`).join('')}</select></div>`:'';
  const l=(st.dados&&st.dados.lista)||[];
  return `${funcs}${filtroPeriodo(s,st)}${carga(st)}
    ${st.dados?`${totaisCartao(st.dados)}
      <button class="btn ghost sm" style="width:100%;margin-bottom:6px" onclick="tentar(()=>imprimirCartao(M['${s}'].ini,M['${s}'].fim,M['${s}'].dados${gestor?`,M['${s}'].fid`:''}))">📄 Cartão em PDF</button>
      ${l.length?l.map(d=>linhaCartao(d,{comprovante:!gestor})).join(''):vazio(st,'Nenhum dia no período.')}`
      :(gestor&&!st.fid?vazio(st,'Escolha um funcionário.'):'')}`;
}
function cardHoras(nome,v,{positivo=true}={}){
  const dia=(v&&v.dia&&v.dia.valores)||[];
  const total=dia.reduce((a,x)=>a+(+x.y||0),0);
  return `<div class="metaBar" style="margin-bottom:10px">
    <div class="top"><div class="kpi"><span class="v" style="font-size:24px;color:${total===0?'var(--txt)':(total>0)===positivo?'var(--ok)':'var(--warn)'}">${hDec(total)}</span>
      <span class="l">${esc(nome)} no período</span></div></div>
    ${dia.length?`<div class="metaSub">${dia.map(x=>`<span>${esc(x.x)} <b>${hDec(x.y)}</b></span>`).join('')}</div>`:''}
  </div>`;
}

/* ---------- solicitações ---------- */
function itemSolicitacao(x,gestor,i){
  const [st,cls]=STATUS_SOLIC[x.status]||['—','mut'];
  const mud=(x.batidas||[]).filter(b=>b&&(b.valor||b.valorOriginal)&&b.valor!==b.valorOriginal)
    .map(b=>`${esc(b.nome)}: ${esc(b.valorOriginal||'—')} → <b>${esc(b.valor||'—')}</b>`).join('<br>');
  const fotos=x.solicitacaoFotoId?`<button class="btn ghost sm" style="width:auto;padding:4px 10px;margin-top:6px"
    onclick="tentar(()=>secArquivo('/Solicitacoes/${+x.solicitacaoFotoId}/FotoAtestado?axpw={axpw}&retornarFotoComoArquivo=true','atestado-${+x.id}.jpg'))">📎 ver anexo</button>`:'';
  const visto=DPF().controleSolicitacoes===1;
  const acoes=(gestor&&x.status===0)?`<div class="acoes2">${visto
      ?`<button class="btn sm" onclick="responderSolicitacao(${i},'visto')">👁️ Marcar visto</button><span></span>`
      :`<button class="btn sm" onclick="responderSolicitacao(${i},'Aceitar')">✓ Aprovar</button>
        <button class="btn ghost sm" style="color:var(--bad)" onclick="responderSolicitacao(${i},'Descartar')">✕ Reprovar</button>`}</div>`
    :(gestor&&x.status===3)?`<div class="acoes2"><button class="btn ghost sm" onclick="responderSolicitacao(${i},'desvisto')">Desmarcar visto</button></div>`:'';
  return `<div class="item"><div class="topo"><b>${esc(x.tipo||'Solicitação')}</b><span class="pill ${cls}">${st}</span></div>
    <p>${gestor&&x.funcionarioNome?esc(x.funcionarioNome)+' · ':''}${dataSec(x.data)}${x.dataFim?' a '+dataSec(x.dataFim):''}${x.dataSolicitacao?' · pedido em '+dataSec(x.dataSolicitacao):''}</p>
    ${mud?`<p>${mud}</p>`:''}
    ${(x.observacao||x.observacoes)?`<p>📝 ${esc(x.observacao||x.observacoes)}</p>`:''}
    ${x.motivo?`<p>Motivo: ${esc(x.motivo)}</p>`:''}
    ${x.motivoRejeicao?`<p style="color:var(--bad)">Rejeitado: ${esc(x.motivoRejeicao)}</p>`:''}
    ${fotos}${acoes}</div>`;
}
// retornarEndpointResponderSolicitacao do app oficial
function rotaResponder(tipo,acao){
  if(tipo===22) return `/Solicitacoes/${acao}VendaFerias`;
  if(tipo===15||tipo===16||tipo===21) return `/Solicitacoes/${acao}Afastamento`;
  if(tipo===19||tipo===20) return `/Solicitacoes/${acao}JustificarInconsistencia`;
  return `/Solicitacoes/${acao}`;
}
function responderSolicitacao(i,acao){
  const x={...M.gSolic.lista[i]};
  const enviar=async(rota,corpo)=>{ if(await tentar(()=>secJson('POST',rota,corpo),'✓ Feito.')){ fecharSheetX(); recarregar('gSolic'); } };
  if(acao==='visto') return enviar('/Solicitacoes/MarcarVisto',x);
  if(acao==='desvisto') return enviar('/Solicitacoes/DesmarcarVisto',x);
  if(acao==='Descartar'){
    window.__responder=async(m)=>{ if(!m.trim()) return toast('Informe o motivo.');
      await enviar(rotaResponder(x.tipoSolicitacao,'Descartar'),{...x,motivoRejeicao:m}); };
    return pedirSenhaOuMotivo({titulo:'Reprovar solicitação',texto:'O funcionário vê esse motivo.',
      rotulo:'Motivo do descarte',acao:'window.__responder'});
  }
  // aceitar com descarte ou inclusão manual sem motivo: o app oficial pede um
  const precisa=(a)=>[1,2,3,4].includes(a.tipo)&&!a.motivo;
  if(!(x.alteracoesFonteDados||[]).some(precisa)) return enviar(rotaResponder(x.tipoSolicitacao,'Aceitar'),x);
  window.__responder=async(m)=>{ if(!m.trim()) return toast('Informe o motivo.');
    await enviar(rotaResponder(x.tipoSolicitacao,'Aceitar'),
      {...x,alteracoesFonteDados:x.alteracoesFonteDados.map(a=>precisa(a)?{...a,motivo:m}:a)}); };
  pedirSenhaOuMotivo({titulo:'Aprovar solicitação',texto:'Há marcações descartadas ou incluídas: o Secullum pede um motivo.',
    rotulo:'Motivo',acao:'window.__responder'});
}

/* ---------- justificar ausência ----------
   O app oficial pede ao Secullum o "molde" do dia (GET /Solicitacoes/{data}/{id})
   e devolve esse objeto com os campos da tela preenchidos — como o ajuste. */
async function enviarAusencia(){
  const st=M.ausencia;
  if(!st.jid) return toast('Escolha o motivo.');
  const j=(st.justs||[]).find(x=>String(x.id)===String(st.jid));
  if(j&&(j.exigirFotoAtestado||j.enviarImagem)&&!st.foto) return toast('Esse motivo exige a foto do atestado.');
  const afast=st.modo==='afast';
  if(afast&&st.fim<st.ini) return toast('O fim do afastamento é antes do início.');
  if(!afast&&st.tipo===1&&!(EH_HORA.test(st.hIni||'')&&EH_HORA.test(st.hFim||''))) return toast('Informe início e fim.');
  const dia=afast?st.ini:st.data;
  let molde={};
  try{ molde=await secJson('GET',`/Solicitacoes/${dia}/{funcionarioId}?origemRequisicao=0`)||{}; }catch(e){}
  const corpo={ funcionarioId:S.func.id||null, solicitanteId:null, filtro1Id:null, filtro2Id:null,
    periculosidade:null, versao:null, dados:null, registroPendente:false, existePeriodoEncerrado:false,
    dataSolicitacao:null, feriasVendaDias:null,
    ...(typeof molde==='object'&&molde?molde:{}),
    data:`${dia}T00:00:00`, justificativaId:+st.jid, observacoes:st.obs||'',
    foto:st.foto||null, temFoto:!!st.foto };
  PARES.forEach(n=>{ if(corpo['entrada'+n]===undefined) corpo['entrada'+n]=''; if(corpo['saida'+n]===undefined) corpo['saida'+n]=''; });
  let rota='/Solicitacoes';
  if(afast){ Object.assign(corpo,{tipo:15,tipoAusencia:1,dataInicioAfastamento:isoSec(st.ini),dataFimAfastamento:isoSec(st.fim)});
    rota='/Solicitacoes/Afastamento'; }
  else{ Object.assign(corpo,{tipo:st.tipo,tipoAusencia:0,dataInicioAfastamento:null,dataFimAfastamento:null});
    if(st.tipo===1){ corpo.entrada1=st.hIni; corpo.saida1=st.hFim; } }
  if(await tentar(()=>secJson('POST',rota,corpo),'Justificativa enviada — vai pro gestor aprovar.')){
    M.ausencia={}; abrirTela('ausencia'); }
}

/* ---------- relógio interno: checa avisos e sincroniza ---------- */
let tickTimer=null;
function startTick(){ if(tickTimer)clearInterval(tickTimer); tickTimer=setInterval(tick,20000); tick(); }
function tick(){
  if(!S.auth.token) return;
  if(S.hoje.data!==hojeStr()){ S.hoje=defHoje(); S.notificados={}; save(); render(); }
  // modo ampulheta: passou do horário previsto e a batida ainda não apareceu →
  // o Secullum pode estar processando; sincroniza a cada 45s por até 25min
  const pend=batidaPendente();
  const intervalo=(pend&&pend.urgente)?45000:S.cfg.pollMin*60000;
  if(!S.ultimaSyncMs||Date.now()-S.ultimaSyncMs>=intervalo) sincronizar();
  checarAvisos();
  const c=$('#clk'); if(c) c.textContent=nowHM();
}
// a próxima batida já deveria ter acontecido e não chegou do Secullum?
function batidaPendente(){
  if(ehFolga()||!S.auth.token) return null;
  const plan=planejarDia(S.hoje,cfgHoje());
  if(plan.estagio>=4) return null;
  const campo=ORDER[plan.estagio];
  const alvo=toMin(plan.plano[campo]||'');
  if(alvo==null) return null;
  const agora=nowMin();
  if(agora<alvo) return null;
  const atraso=agora-alvo;
  // depois de ~20min o Secullum já processou: se não chegou, a batida não existe.
  // Continuar dizendo "esperando" trava a tela e esconde o que fazer.
  return {campo, desde:hm(alvo), atraso, urgente:atraso<=25, sumiu:atraso>20};
}

async function carregarHistorico(force=false){
  if(!S.auth.token) return;
  if(!force&&S.hist.ts&&Date.now()-S.hist.ts<5*60000) return;
  const f=(d)=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  const fim=new Date(), ini=new Date(); ini.setDate(ini.getDate()-30);
  const rota=`/me/espelho?inicio=${f(ini)}&fim=${f(fim)}`;
  let r;
  try{ r=await api(rota); }catch(e){ return; }
  if(r.status===401){ if(!(await reloginSilencioso())) return; try{ r=await api(rota); }catch(e){ return; } }
  if(!r.ok) return;
  let data=null; try{ data=JSON.parse(await r.text()); }catch(e){}
  if(!data) return;
  S.hist={ts:Date.now(),dias:normalizaEspelho(data).filter(d=>d.iso&&d.iso<=hojeStr()).sort((a,b)=>a.iso<b.iso?1:-1)};
  save(); if(view==='hist') render();
}
function cargaDoDia(iso){ const wd=new Date(iso+'T12:00:00').getDay();
  if(wd===5) return S.cfg.cargaSex; if(wd>=1&&wd<=4) return S.cfg.cargaSegQui; return 0; }
function minutosTrabalhados(bat){
  if(!bat||bat.length<4) return null;
  const E=toMin(bat[0]),A1=toMin(bat[1]),A2=toMin(bat[2]),Sd=toMin(bat[3]);
  if([E,A1,A2,Sd].some(x=>x==null)) return null;
  return {trab:(A1-E)+(Sd-A2), almoco:A2-A1};
}
function chipBat(rotulo,valor){ return `<div class="chip"><small>${rotulo}</small><b>${valor||'—'}</b></div>`; }
function linhaDia(d,ehHoje){
  const m=minutosTrabalhados(d.bat);
  let saldoHtml='';
  if(d.fds&&!d.bat.length) saldoHtml='<span class="pill mut">folga</span>';
  else if(d.saldoStr) saldoHtml=`<span class="pill ${d.saldoStr.startsWith('-')?'warn':(/[1-9]/.test(d.saldoStr)?'bad':'ok')}">saldo ${d.saldoStr}</span>`;
  else if(m){ const dif=m.trab-cargaDoDia(d.iso);
    saldoHtml=dif===0?'<span class="pill ok">zerou 🎯</span>':dif>0?`<span class="pill bad">+${dif}min extra</span>`:`<span class="pill warn">−${-dif}min desconto</span>`; }
  else if(!ehHoje&&d.bat.length) saldoHtml=`<span class="pill warn">${d.bat.length} batida${d.bat.length>1?'s':''}</span>`;
  else if(ehHoje) saldoHtml='<span class="pill mut">em andamento</span>';
  const almocoTxt=(d.bat[1]&&d.bat[2])?`${d.bat[1]}–${d.bat[2]}`:(d.bat[1]||'—');
  // dia útil com batida faltando: dá pra corrigir daqui, sem depender de ser hoje
  const iInc=incDoDia(d.iso);
  // as três ações em todo dia: esconder botão obriga a adivinhar quando ele existe
  const acoes=`<div class="acoesDia">
    <button class="btn ghost sm" onclick="verDetalhes('${d.iso}')">🔎 detalhes</button>
    <button class="btn ghost sm jusLinha" onclick="abrirJustificar(${iInc},'${d.iso}')">⚠️ justificar</button>
    <button class="btn ghost sm" onclick="abrirIncluir(null,'${d.iso}')">＋ ajustar</button>
  </div>`;
  return `<div class="dia ${ehHoje?'diaHoje':''} ${d.fds?'diaFds':''}">
    <div class="diaHead"><b>${d.dia} ${d.data}</b>${ehHoje?'<span class="pill ok" style="margin-left:8px">hoje</span>':''}<span style="flex:1"></span>${saldoHtml}</div>
    ${(d.fds&&!d.bat.length)?'':`<div class="batChips">
      ${chipBat('🏢 entrada',d.bat[0])}
      ${chipBat('🍽️ almoço',almocoTxt)}
      ${chipBat('🏁 saída',d.bat[3])}
      ${m?chipBat('⏱️ trabalhado',hm(m.trab)):''}
    </div>`}
    ${acoes}
    <div class="detDia hidden" id="det-${d.iso}">${detalhesDia(d)}</div>
  </div>`;
}

/* Detalhe do dia: as quatro batidas com nome, o que o motor calcularia e o
   saldo. É o que responde "por que esse dia deu isso". */
function detalhesDia(d){
  const linhas=ORDER.map((k,i)=>
    `<div class="detLinha"><span>${LABELS[k]}</span><b>${d.bat[i]||'—'}</b></div>`).join('');
  const carga=cargaDoDia(d.iso);
  const m=minutosTrabalhados(d.bat);
  let extra='';
  if(!d.fds){
    const p=planejarDia(batidasDoDia(d.iso),cfgDoDia(d.iso));
    extra=`<div class="detLinha"><span>carga do dia</span><b>${hm(carga)}</b></div>
      <div class="detLinha"><span>saída que zera</span><b>${p.alvoSaida||'—'}</b></div>
      ${m?`<div class="detLinha"><span>trabalhado</span><b>${hm(m.trab)}</b></div>
        <div class="detLinha"><span>saldo</span><b>${m.trab-carga===0?'zerado':(m.trab-carga>0?'+':'−')+hm(Math.abs(m.trab-carga))}</b></div>`
        :'<div class="detLinha"><span>saldo</span><b>dia incompleto</b></div>'}`;
  } else extra='<div class="detLinha"><span>dia</span><b>folga, sem carga</b></div>';
  const inc=inconsistencias[incDoDia(d.iso)];
  const pend=inc?`<div class="detLinha" style="color:var(--warn)"><span>pendência</span><b>${descreverInc(inc).txt}</b></div>`:'';
  return linhas+extra+pend;
}

async function testarGateway(){
  const url=((($('#c_gw')&&$('#c_gw').value.trim())||gwUrl())).replace(/\/$/,'');
  toast('Testando '+url+'…');
  let ok=false;
  try{ ok=(await (await fetch(url+'/health')).json()).ok===true; }
  catch(e){ return toast('Não conectou: '+(e.message||e)); }
  if(!ok) return toast('Respondeu, mas sem ok — confira a URL.');
  if(!S.auth.token) return toast('✓ Gateway online. Entre na conta pra conferir as rotas de ajuste.');
  // /health já existia antes das rotas novas, então sozinho não diz se elas
  // subiram. /me/solicitacoes mora no mesmo bloco delas e é só leitura: se
  // responde, ajustar e justificar também estão no ar — e dá pra conferir sem
  // criar uma solicitação de verdade na fila do gestor só pra testar.
  const hoje=hojeStr();
  try{
    const r=await fetch(url+`/me/solicitacoes?inicio=${hoje}&fim=${hoje}`,
      {headers:{Authorization:'Bearer '+S.auth.token}});
    if(r.status===404) return toast('✓ Online, mas sem as rotas novas: ajustar e justificar ainda não funcionam.');
    if(r.status===401) return toast('✓ Online. A sessão expirou — entre de novo e teste outra vez.');
    // /me/api é o que destrava as telas do Mais e o registrar ponto; conferimos
    // com uma leitura inofensiva, a lista de justificativas
    const a=await fetch(url+'/me/api',{method:'POST',headers:{Authorization:'Bearer '+S.auth.token,'Content-Type':'application/json'},
      body:JSON.stringify({metodo:'GET',rota:'/Justificativas'})});
    if(a.status===404) return toast('✓ Online com ajuste e justificativa, mas sem /me/api: o Mais e o registrar ponto ainda não funcionam.');
    toast('✓ Online, com todas as rotas publicadas.');
  }catch(e){ toast('✓ Online, mas a checagem das rotas falhou: '+(e.message||e)); }
}

function instalarApp(){
  if(ehInstalado()) return toast('Já está instalado — você está usando o app da tela inicial.');
  if(deferredPrompt){ deferredPrompt.prompt(); deferredPrompt=null; return; }
  if(!window.isSecureContext) return toast('Só instala em HTTPS — abra pelo endereço publicado, não pelo arquivo salvo.');
  if(ehIOS()) return toast('No Safari: Compartilhar → Adicionar à Tela de Início. Só o Safari instala no iPhone.');
  toast('Menu do navegador → Instalar app / Adicionar à tela inicial. Se não aparecer, recarregue a página uma vez.');
}
if('serviceWorker'in navigator){ window.addEventListener('load',()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); }); }

/* =====================================================================
   BOOT
   ===================================================================== */
let toastT=null;
function toast(msg){ const t=$('#toast'); if(!t)return; t.textContent=msg; t.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),3200); }
function mostrarLogin(){ $('#app').classList.add('hidden'); $('#login').classList.remove('hidden');
  if(S.auth.banco)$('#l_banco').value=S.auth.banco;
  if(S.auth.usuario)$('#l_user').value=S.auth.usuario;
  $('#l_tipo').value=S.auth.tipo||'0'; }
function voltarLogin(){ S.auth.token=''; save(); if(tickTimer)clearInterval(tickTimer); mostrarLogin(); }
function enterApp(){ $('#login').classList.add('hidden'); $('#app').classList.remove('hidden');
  setSync(S.ultimaSyncMs?'ok':'—'); render(); startTick(); sincronizar(false);
  carregarPerfil(); carregarInconsistencias(); prepararAvisos(); }

/* Ao abrir o app já deixamos os avisos prontos, sem esperar o usuário ir nos
   ajustes. Quem entra com sessão salva nunca passava pelo login, então nunca
   era perguntado. O navegador pode engolir o pedido automático (o Chrome
   silencia quem pede sem gesto), por isso ainda mostramos o convite. */
async function prepararAvisos(){
  // no APK quem acorda o aparelho é o AlarmManager, não a permissão do navegador
  if(temPonteNativa()){
    armarAlarmesNativos(); esconderConvite(); atualizarDiagNotif();
    // confere versão nova em segundo plano; só fala se houver
    try{ if(typeof AndroidAlarme.verificarAtualizacao==='function') AndroidAlarme.verificarAtualizacao(); }catch(e){}
    return;
  }
  if(porQueSemNotificacao()){ mostrarConvite(); return; }
  if(Notification.permission==='default'){
    try{ await Notification.requestPermission(); }catch(e){}
  }
  if(Notification.permission!=='granted'){ mostrarConvite(); return; }
  if(S.pushInscrito) enviarAgenda(null,true);        // renova a agenda a cada abertura
  else mostrarConvite();
  atualizarDiagNotif();
}

/* Faixa no topo quando falta algo pros avisos funcionarem. O botão importa:
   dá o gesto do usuário, que é o que os navegadores realmente respeitam. */
function mostrarConvite(){
  const box=$('#convite'); if(!box) return;
  const motivo=porQueSemNotificacao();
  let txt, rotulo, acao;
  if(motivo){ txt=motivo; rotulo='Instalar'; acao='instalarApp()'; }
  else if(Notification.permission!=='granted'){
    txt='Libere as notificações pra eu avisar na hora de bater o ponto.';
    rotulo='Permitir'; acao='pedirPermissao().then(esconderConvite)';
  } else if(!S.pushInscrito){
    txt='Ligue o push pra receber os avisos mesmo com o app fechado.';
    rotulo='Ligar'; acao='assinarPush().then(esconderConvite)';
  } else { esconderConvite(); return; }
  box.innerHTML=`<div class="card" style="border-color:var(--warn)">
    <div class="switchRow"><div class="tx"><b>🔔 Avisos desligados</b><small>${txt}</small></div></div>
    <div class="row2" style="margin-top:10px">
      <button class="btn sm" style="width:100%" onclick="${acao}">${rotulo}</button>
      <button class="btn ghost sm" style="width:100%" onclick="esconderConvite()">Agora não</button>
    </div></div>`;
  box.classList.remove('hidden');
}
function esconderConvite(){ const b=$('#convite'); if(b) b.classList.add('hidden'); }
$('#l_lembrar').onclick=(e)=>e.currentTarget.classList.toggle('on');
(async function boot(){
  if(S.auth.token){ enterApp(); }
  else if(S.auth.usuario&&S.auth.senha){
    toast('Reconectando…');
    if(await reloginSilencioso()) enterApp(); else mostrarLogin();
  } else mostrarLogin();
})();
</script>
