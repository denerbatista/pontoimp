<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0f1220" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>PontoImp</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icon-192-v2.png" />
<link rel="apple-touch-icon" href="icon-192-v2.png" />
<style>
  :root{
    --bg:#0f1220; --bg2:#151a2e; --card:#1b2138; --card2:#212a47;
    --line:#2b3455; --txt:#eef1fb; --mut:#9aa5c8; --mut2:#6f7aa3;
    --pri:#6c8cff; --pri2:#8a6cff; --grad:linear-gradient(135deg,#6c8cff,#8a6cff);
    --ok:#37d39b; --warn:#ffb454; --bad:#ff6b81; --ring:0 0 0 3px rgba(108,140,255,.25);
    --sh:0 12px 30px rgba(0,0,0,.35); --r:18px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:radial-gradient(1200px 600px at 80% -10%,rgba(138,108,255,.18),transparent 60%),
               radial-gradient(1000px 500px at -10% 10%,rgba(108,140,255,.15),transparent 55%),var(--bg);
    color:var(--txt);font:15px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Inter,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
  .hidden{display:none!important}
  .muted{color:var(--mut)}
  .pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600}
  .pill.ok{background:rgba(55,211,155,.14);color:var(--ok)}
  .pill.warn{background:rgba(255,180,84,.14);color:var(--warn)}
  .pill.bad{background:rgba(255,107,129,.14);color:var(--bad)}
  .pill.mut{background:rgba(154,165,200,.12);color:var(--mut)}

  /* ---------- LOGIN ---------- */
  #login{min-height:100%;display:grid;place-items:center;padding:24px}
  .loginCard{width:100%;max-width:400px;background:linear-gradient(180deg,var(--card2),var(--card));
    border:1px solid var(--line);border-radius:24px;box-shadow:var(--sh);padding:34px 30px}
  .brand{display:flex;align-items:center;gap:12px;justify-content:center;margin-bottom:6px}
  .brand .logo{width:44px;height:44px;border-radius:13px;display:block;object-fit:cover;
    box-shadow:0 8px 20px rgba(108,140,255,.32)}
  .brand h1{font-size:24px;margin:0;letter-spacing:-.5px}
  .brand h1 span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{text-align:center;color:var(--mut);margin:2px 0 22px;font-size:13px}
  .field{margin-bottom:13px}
  .field label{display:block;font-size:12px;color:var(--mut);margin:0 0 6px 2px;font-weight:600}
  .field input,.field select{width:100%;padding:12px 13px;background:var(--bg2);border:1px solid var(--line);
    border-radius:12px;color:var(--txt);outline:none;transition:.15s;color-scheme:dark}
  .field input:focus,.field select:focus{border-color:var(--pri);box-shadow:var(--ring)}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .btn{width:100%;padding:13px;border-radius:12px;background:var(--grad);color:#fff;font-weight:700;
    box-shadow:0 10px 24px rgba(108,140,255,.4);transition:.15s;letter-spacing:.2px}
  .btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--txt);box-shadow:none;font-weight:600}
  .btn.sm{width:auto;padding:9px 15px;font-size:13px}

  /* ---------- APP ---------- */
  /* o padding de baixo abre espaço pra barra fixa, respeitando a área segura do iPhone */
  #app{min-height:100%;max-width:640px;margin:0 auto;
    padding:16px 16px calc(84px + env(safe-area-inset-bottom))}
  .hd{display:flex;align-items:center;gap:10px;margin:4px 0 16px}
  .hd .brand{cursor:pointer}
  .hd .brand:active{opacity:.6}

  /* ---------- BARRA DE NAVEGAÇÃO (polegar alcança) ---------- */
  .nav{position:fixed;left:0;right:0;bottom:0;z-index:40;
    display:grid;grid-template-columns:repeat(4,1fr);gap:4px;
    padding:8px 10px calc(8px + env(safe-area-inset-bottom));
    background:rgba(21,26,46,.92);backdrop-filter:blur(14px);
    border-top:1px solid var(--line)}
  .nav button{display:grid;justify-items:center;gap:3px;padding:7px 4px;border-radius:13px;
    color:var(--mut2);font-size:11px;font-weight:600;transition:.15s}
  .nav button i{font-style:normal;font-size:20px;line-height:1}
  .nav button.on{color:var(--pri);background:rgba(108,140,255,.13)}
  .nav button:active{transform:scale(.94)}
  .hd .brand{justify-content:flex-start;margin:0;flex:1}
  .hd .brand h1{font-size:20px}
  .hd .brand .logo{width:38px;height:38px;border-radius:11px}
  .iconBtn{width:40px;height:40px;border-radius:11px;background:var(--card);border:1px solid var(--line);
    display:grid;place-items:center;font-size:17px;flex:none}
  .cards{display:grid;gap:14px}
  .card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);
    border-radius:var(--r);box-shadow:var(--sh);padding:20px}
  .card h3{margin:0 0 14px;font-size:13px;color:var(--mut);text-transform:uppercase;letter-spacing:.6px;font-weight:700}

  .clock{text-align:center;padding:2px 0}
  .clock .t{font-size:50px;font-weight:800;letter-spacing:-1px;font-variant-numeric:tabular-nums}
  .clock .d{color:var(--mut);font-size:13px;margin-top:-4px}
  .metaBar{padding:14px;border-radius:13px;background:var(--bg2);border:1px solid var(--line)}
  /* hora e selo na mesma linha de base; a hora nunca encolhe */
  .metaBar .top{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .kpi{display:flex;flex-direction:column;gap:2px;min-width:0}
  .kpi .v{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
  .kpi .l{color:var(--mut);font-size:12px}
  .metaBar .top .pill{flex:none;white-space:nowrap}
  /* dados de apoio em linha própria: alinhados à esquerda, sem quebra torta */
  .metaSub{display:flex;flex-wrap:wrap;gap:2px 16px;margin-top:12px;padding-top:11px;
    border-top:1px solid var(--line);color:var(--mut);font-size:12px}
  .metaSub b{color:var(--txt);font-weight:600;font-variant-numeric:tabular-nums}

  .timeline{display:flex;flex-direction:column;gap:2px}
  /* 4ª coluna: botão de incluir batida (colapsa sozinha quando não aparece) */
  .tl{display:grid;grid-template-columns:34px 1fr auto auto;align-items:center;gap:10px;padding:10px;border-radius:12px}
  .tl .incBtn{width:32px;height:32px;padding:0;border-radius:10px;font-size:17px;line-height:1;flex:none}
  /* ações do dia no histórico: três sempre visíveis, sem obrigar a adivinhar */
  .acoesDia{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
  .acoesDia .btn{width:100%;padding:7px 0;font-size:12px;height:auto}
  .detDia{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
  .detLinha{display:flex;justify-content:space-between;gap:10px;padding:4px 0;font-size:13px;color:var(--mut)}
  .detLinha b{color:var(--txt);font-variant-numeric:tabular-nums}
  /* pares entrada/saída do ajuste de ponto, lado a lado como na Central */
  .parPonto{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
  .parPonto label{font-size:11px}
  .tl:hover{background:var(--bg2)}
  .tl .dot{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:15px;
    background:var(--card);border:1px solid var(--line)}
  .tl.done .dot{background:rgba(55,211,155,.15);border-color:transparent;color:var(--ok)}
  .tl.next .dot{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 6px 16px rgba(108,140,255,.5)}
  .tl .lb{font-weight:600}
  .tl .lb small{display:block;color:var(--mut);font-weight:500;font-size:12px}
  .tl .hr{font-weight:800;font-variant-numeric:tabular-nums;font-size:16px}
  .tl .hr small{color:var(--mut);font-weight:600}

  .toggle{position:relative;width:46px;height:27px;border-radius:999px;background:var(--line);transition:.2s;flex:none;cursor:pointer}
  .toggle::after{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:.2s}
  .toggle.on{background:var(--ok)}
  .toggle.on::after{left:22px}
  .switchRow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
  .switchRow:last-child{border-bottom:0}
  .switchRow .tx b{font-weight:700}
  .switchRow .tx small{display:block;color:var(--mut);font-size:12px;margin-top:2px}
  .cfgGrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:640px){.cfgGrid{grid-template-columns:1fr}}

  /* ---------- SHEET (pergunta do almoço) ---------- */
  .sheetBg{position:fixed;inset:0;background:rgba(8,10,20,.65);backdrop-filter:blur(3px);
    display:grid;place-items:end center;z-index:50}
  .sheet{width:100%;max-width:480px;background:linear-gradient(180deg,var(--card2),var(--card));
    border:1px solid var(--line);border-radius:22px 22px 0 0;padding:24px 22px 28px;box-shadow:var(--sh)}
  @media(min-width:720px){.sheetBg{place-items:center}.sheet{border-radius:22px}}

  /* ---------- HISTÓRICO ---------- */
  .dia{padding:12px 2px;border-bottom:1px solid var(--line)}
  .dia:last-child{border-bottom:0}
  .diaHead{display:flex;align-items:center;gap:4px}
  .diaHoje{background:rgba(108,140,255,.07);border:1px solid rgba(108,140,255,.3);border-radius:14px;padding:12px;margin-bottom:8px}
  .diaFds{opacity:.55}
  .batChips{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .chip{background:var(--bg2);border:1px solid var(--line);border-radius:11px;padding:7px 11px;min-width:86px}
  .chip small{display:block;color:var(--mut);font-size:11px;margin-bottom:1px}
  .chip b{font-variant-numeric:tabular-nums;font-size:14px}

  /* ---------- ALARME ---------- */
  .alarmOverlay{position:fixed;inset:0;background:rgba(10,6,14,.9);backdrop-filter:blur(6px);
    display:grid;place-items:center;z-index:70;animation:alrmBg 1s infinite alternate}
  @keyframes alrmBg{from{background:rgba(10,6,14,.9)}to{background:rgba(64,10,26,.9)}}
  .alarmBox{text-align:center;padding:34px;max-width:420px}
  .alarmIco{font-size:74px;animation:alrmShake .5s infinite}
  @keyframes alrmShake{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(12deg)}}
  .alarmBox h2{font-size:26px;margin:10px 0 8px}
  .alarmBox p{margin:0 0 24px;font-size:15px}

  /* no topo: embaixo ele disputava espaço com a barra de abas e com os
     botões das sheets, que são justamente o que o usuário vai tocar */
  /* ---------- MAIS: as telas do app oficial ---------- */
  .menuGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .menuGrid button{display:grid;justify-items:center;gap:6px;padding:14px 6px;border-radius:14px;
    background:var(--bg2);border:1px solid var(--line);font-size:12px;font-weight:600;text-align:center;line-height:1.25}
  .menuGrid>*{min-width:0;overflow-wrap:anywhere;hyphens:auto}
  .menuGrid button i{font-style:normal;font-size:24px;line-height:1}
  .menuGrid button:active{transform:scale(.96)}
  .voltar{display:flex;align-items:center;gap:8px;margin:0 0 2px;color:var(--mut);font-weight:600;font-size:14px}
  .item{padding:12px 2px;border-bottom:1px solid var(--line)}
  .item:last-child{border-bottom:0}
  .item .topo{display:flex;align-items:center;gap:8px}
  .item .topo b{flex:1;min-width:0}
  .item p{margin:6px 0 0;font-size:13px;color:var(--mut);white-space:pre-wrap;word-break:break-word}
  .acoes2{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
  .acoes2 .btn{width:100%;padding:8px 0;font-size:12px}
  /* duas datas lado a lado e o Buscar embaixo: campo de data no Android não
     encolhe abaixo da largura natural, e com o botão na mesma linha passava
     da tela de 360px e dava scroll lateral */
  .filtros{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:end}
  .filtros .field{margin:0}
  .filtros .btn{grid-column:1/-1;height:42px}
  /* item de grid não encolhe abaixo do conteúdo sem isto (min-width:auto) */
  .cards>*,.row2>*,.cfgGrid>*,.filtros>*,.parPonto>*{min-width:0}
  .field input,.field select{min-width:0;max-width:100%}
  .barra{height:8px;border-radius:99px;background:var(--bg2);overflow:hidden;margin-top:4px}
  .barra span{display:block;height:100%;background:var(--grad)}
  .termo{max-height:50vh;overflow:auto;font-size:13px;color:var(--mut);white-space:pre-wrap}
  .camBox{position:relative;border-radius:14px;overflow:hidden;background:#000;aspect-ratio:3/4;max-height:42vh;margin:0 auto 12px}
  .camBox video,.camBox img{width:100%;height:100%;object-fit:cover;display:block}
  .regGrande{width:100%;padding:16px;font-size:16px;margin-top:12px}

  .toast{position:fixed;top:calc(14px + env(safe-area-inset-top));
    left:50%;transform:translateX(-50%) translateY(-20px);opacity:0;
    background:var(--card2);border:1px solid var(--line);box-shadow:var(--sh);padding:13px 18px;border-radius:14px;
    transition:.25s;z-index:60;font-weight:600;max-width:90vw;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<!-- ========================= LOGIN ========================= -->
<section id="login">
  <div class="loginCard">
    <div class="brand"><img class="logo" src="icon-192-v2.png" alt=""><h1>Ponto<span>Imp</span></h1></div>
    <div class="sub">Sentinela do seu ponto Secullum — zero extra, zero desconto.</div>
    <div class="field"><label>Empresa (banco)</label><input id="l_banco" placeholder="nº da empresa" autocomplete="off" inputmode="numeric"></div>
    <div class="row2">
      <div class="field"><label>Tipo</label>
        <select id="l_tipo"><option value="0">Nº Folha</option><option value="1">Identificador</option></select></div>
      <div class="field"><label>Usuário</label><input id="l_user" placeholder="seu nº folha" autocomplete="off"></div>
    </div>
    <div class="field"><label>Senha</label><input id="l_pass" type="password" placeholder="sua senha"></div>
    <div class="switchRow" style="border:0;padding:4px 0 14px">
      <div class="tx"><b>Manter conectado</b><small>login fica salvo só neste aparelho</small></div>
      <div class="toggle on" id="l_lembrar"></div>
    </div>
    <button class="btn" onclick="doLogin()">Entrar</button>
    <button class="btn ghost sm" style="margin-top:12px;width:100%;border:0;color:var(--mut)" onclick="abrirRecuperarSenha()">Esqueci minha senha</button>
  </div>
</section>

<!-- ========================= APP ========================= -->
<section id="app" class="hidden">
  <div class="hd">
    <div class="brand" onclick="go('hoje')" title="Voltar ao início">
      <img class="logo" src="icon-192-v2.png" alt=""><h1>Ponto<span>Imp</span></h1></div>
    <span class="pill mut" id="syncPill">—</span>
    <button class="iconBtn" onclick="sincronizar(false)" title="Atualizar do Secullum agora">⟳</button>
  </div>
  <div id="convite" class="cards hidden"></div>
  <div id="views" class="cards"></div>
  <nav class="nav" id="nav">
    <button onclick="go('hoje')" data-v="hoje"><i>🏠</i>Hoje</button>
    <button onclick="go('hist')" data-v="hist"><i>📋</i>Histórico</button>
    <button onclick="go('mais')" data-v="mais"><i>☰</i>Mais</button>
    <button onclick="go('cfg')" data-v="cfg"><i>⚙️</i>Ajustes</button>
  </nav>
</section>

<!-- ================== SHEET DA JUSTIFICATIVA ================== -->
<div class="sheetBg hidden" id="sheetJus">
  <div class="sheet">
    <h3 style="margin:0 0 6px">Justificar inconsistência</h3>
    <p class="muted" id="jusTxt" style="margin:0 0 16px;font-size:13px"></p>
    <div class="field"><label>Justificativa do Secullum</label>
      <select id="jusSel"></select></div>
    <div class="field"><label>Ou escreva a sua</label>
      <input id="jusLivre" placeholder="deixe vazio pra usar a de cima"></div>
    <p class="muted" style="font-size:12px;margin:0 0 16px">Vai pro seu gestor aprovar.</p>
    <button class="btn" id="jusBtn" onclick="confirmarJustificativa()">Enviar justificativa</button>
    <button class="btn ghost sm" style="margin-top:16px;width:100%;border:0;color:var(--mut)" onclick="fecharJustificar()">cancelar</button>
  </div>
</div>

<!-- ===================== SHEET DO PONTO MANUAL ===================== -->
<div class="sheetBg hidden" id="sheetInc">
  <div class="sheet">
    <h3 style="margin:0 0 6px">Ajustar ponto — <span id="incTitulo"></span></h3>
    <p class="muted" style="margin:0 0 14px;font-size:13px">Vai como solicitação, pro seu gestor aprovar.</p>
    <div id="incPares" style="max-height:44vh;overflow:auto"></div>
    <button class="btn ghost sm" style="width:100%;margin:10px 0" onclick="sugerirHorarios()">✨ Preencher o que falta pelo motor</button>
    <div class="field"><label>Observação</label>
      <input id="incObs" placeholder="ex.: retorno sem registro"></div>
    <p class="muted" id="incPrevia" style="font-size:12px;margin:0 0 16px"></p>
    <button class="btn" id="incBtn" onclick="confirmarInclusao()">Enviar ajuste</button>
    <button class="btn ghost sm" style="margin-top:16px;width:100%;border:0;color:var(--mut)" onclick="fecharIncluir()">cancelar</button>
  </div>
</div>

<!-- ============ SHEET GENÉRICA (formulários das telas do Mais) ============ -->
<div class="sheetBg hidden" id="sheetX">
  <div class="sheet" style="max-height:92vh;overflow:auto">
    <div id="sheetXBox"></div>
    <button class="btn ghost sm" style="margin-top:16px;width:100%;border:0;color:var(--mut)" onclick="fecharSheetX()">cancelar</button>
  </div>
</div>

<!-- ========================= SHEET DO ALMOÇO ========================= -->
<div class="sheetBg hidden" id="sheetAlm">
  <div class="sheet">
    <h3 style="margin:0 0 6px">🍽️ Almoço de hoje</h3>
    <p class="muted" id="almTxt" style="margin:0 0 18px;font-size:13px"></p>
    <button class="btn" onclick="almocoPadrao()">Seguir o padrão</button>
    <button class="btn ghost" style="margin-top:9px" onclick="almocoSnooze()">Me lembra em 15 min</button>
    <div class="row2" style="margin-top:9px;align-items:stretch">
      <div class="field" style="margin:0"><input id="almHora" type="time"></div>
      <button class="btn ghost" style="padding:9px" onclick="almocoOutraHora()">Vou nesse horário</button>
    </div>
    <button class="btn ghost sm" style="margin-top:16px;width:100%;border:0;color:var(--mut)" onclick="fecharSheet()">fechar</button>
  </div>
</div>

<!-- ========================= ALARME ========================= -->
<div class="alarmOverlay hidden" id="alarmOverlay">
  <div class="alarmBox">
    <div class="alarmIco">⏰</div>
    <h2 id="alarmTitulo">Alarme</h2>
    <p id="alarmCorpo" class="muted"></p>
    <button class="btn" style="background:linear-gradient(135deg,#ff6b81,#ff8f6b);box-shadow:0 10px 24px rgba(255,107,129,.4)" onclick="pararAlarme()">PARAR ALARME</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* =====================================================================
   MOTOR v6 — fechamento DIÁRIO, sem banco de horas (testado no Node — 21/21)
   Alvo: ZERAR o dia. Passar da carga = hora extra (irreversível).
   Faltar = desconto. Cada dia fecha em si mesmo.
   v6: meta de saída agora é ATIVA — pra sair mais cedo o motor usa
   1º os minutos adiantados da entrada, 2º desconta do almoço (até o piso).
   ===================================================================== */
const hm = (m)=>{m=Math.round(m);const h=Math.floor(m/60),x=((m%60)+60)%60;return String(h).padStart(2,'0')+':'+String(x).padStart(2,'0');};
// batida do Secullum é sempre HH:MM; "FALTA" e afins não são horário
const EH_HORA = /^([01]\d|2[0-3]):[0-5]\d$/;
// aceita 8:12 e 08:12 (campos de duração são digitados à mão), mas nunca texto solto
const toMin = (s)=>{ const m=/^(\d{1,2}):([0-5]\d)$/.exec(String(s??'').trim());
  return m ? (+m[1])*60 + (+m[2]) : null; };

function planejarDia(batidas, config){
  const c = { cargaMin:492, entradaPadrao:'08:00', saidaAlmocoPadrao:'12:00',
    almocoMin:108, almocoPiso:60, compensarAtrasoNoAlmoco:true, adiantamento:'sair_cedo',
    metaSaida:null, toleranciaMin:0, ativo:true, ...config };
  const E=toMin(batidas.entrada), A1=toMin(batidas.saidaAlmoco),
        A2=toMin(batidas.voltaAlmoco), S=toMin(batidas.saida);
  const carga=c.cargaMin, meta=toMin(c.metaSaida),
        entradaPad=toMin(c.entradaPadrao), a1Pad=toMin(c.saidaAlmocoPadrao);
  const avisos=[]; let estagio=0;
  if(E!=null)estagio=1; if(A1!=null)estagio=2; if(A2!=null)estagio=3; if(S!=null)estagio=4;
  const atrasoMin = E!=null?Math.max(0,E-entradaPad):0;
  const adiantMin = E!=null?Math.max(0,entradaPad-E):0;
  const eBase = E!=null?E:entradaPad;
  // almoço planejado: parte do padrão e é ajustado pela chegada.
  //  atrasado  -> encurta até o piso pra compensar; o que sobrar empurra a saída.
  //  adiantado -> 'sair_cedo' (padrão) sai antes; 'almoco_maior' estica pra sair no horário.
  let almoco=c.almocoMin, recuperado=0, restanteAtraso=0;
  if(atrasoMin>0 && c.compensarAtrasoNoAlmoco){
    const absorvivel=Math.max(0,c.almocoMin-c.almocoPiso);
    recuperado=Math.min(atrasoMin,absorvivel);
    restanteAtraso=atrasoMin-recuperado;
    almoco=c.almocoMin-recuperado;
  } else if(adiantMin>0 && c.adiantamento==='almoco_maior'){
    almoco=c.almocoMin+adiantMin;
  }
  // meta de saída (v6): quer sair mais cedo?
  // Saída = entrada real + carga + almoço, então quem chegou adiantado JÁ sai
  // mais cedo — o adiantamento é consumido primeiro, por construção. Se ainda
  // não bastar pra bater a meta (ou se chegou na hora/atrasado), o que falta
  // é descontado do almoço, respeitando o piso. Sobrou déficit? Vira desconto
  // e o app avisa.
  const almocoAposAtraso=almoco;
  let cortadoMeta=0, faltaMeta=0;
  if(meta!=null && c.ativo && estagio<=2){
    const excesso=(eBase+carga+almoco)-meta;
    if(excesso>0){
      const flex=Math.max(0,almoco-c.almocoPiso);
      cortadoMeta=Math.min(excesso,flex);
      faltaMeta=excesso-cortadoMeta;
      almoco-=cortadoMeta;
    }
  }
  let plano={ entrada:batidas.entrada??c.entradaPadrao, saidaAlmoco:batidas.saidaAlmoco??c.saidaAlmocoPadrao,
    voltaAlmoco:null, saida:null };
  let alvoSaida=null, custoNaMeta={tipo:'zero',min:0};
  if(estagio<=2){
    const a1 = A1!=null?A1:Math.max(a1Pad,eBase);
    const volta=a1+almoco, saida=volta+(carga-(a1-eBase));
    alvoSaida=saida;
    plano.saidaAlmoco = A1!=null?batidas.saidaAlmoco:hm(a1);
    plano.voltaAlmoco = hm(volta);
    plano.saida = hm(saida);
  } else {
    const manha=A1-E, tarde=carga-manha;
    alvoSaida=A2+tarde; plano.voltaAlmoco=batidas.voltaAlmoco; plano.saida=hm(alvoSaida);
  }
  if(atrasoMin>0){
    if(estagio<=2 && c.compensarAtrasoNoAlmoco){
      avisos.push(restanteAtraso===0
        ? `Entrou ${atrasoMin}min atrasado — recuperado no almoço (agora ${hm(almocoAposAtraso)}).${cortadoMeta>0?'':' Fecha no horário.'}`
        : `Entrou ${atrasoMin}min atrasado — almoço no mínimo (${hm(almocoAposAtraso)}) e saída +${restanteAtraso}min.`);
    } else if(estagio>=3) avisos.push(`Entrou ${atrasoMin}min atrasado.`);
  } else if(adiantMin>0 && estagio<=2){
    if(c.adiantamento==='almoco_maior' && cortadoMeta===0){
      avisos.push(`Entrou ${adiantMin}min adiantado — almoço maior (${hm(almoco)}) pra sair no horário.`);
      if(almoco>120) avisos.push(`Almoço acima de 2h — confira se sua empresa permite.`);
    } else if(c.adiantamento!=='almoco_maior' && cortadoMeta===0 && faltaMeta===0)
      avisos.push(`Entrou ${adiantMin}min adiantado — você sai mais cedo hoje.`);
  }
  if(cortadoMeta>0||faltaMeta>0){
    const partes=[];
    if(adiantMin>0) partes.push(`${adiantMin}min adiantados`);
    if(cortadoMeta>0) partes.push(`${cortadoMeta}min a menos de almoço (fica ${hm(almoco)})`);
    if(faltaMeta===0)
      avisos.push(`Pra sair ${c.metaSaida} zerando o dia: ${partes.join(' + ')}.`);
    else
      avisos.push(`Meta ${c.metaSaida}: mesmo ${adiantMin>0?`com ${adiantMin}min adiantados e `:'com '}almoço no mínimo (${hm(almoco)}), o dia só fecha ${hm(eBase+carga+almoco)}. Sair na meta deixa ${faltaMeta}min de desconto.`);
  }
  if(meta!=null && c.ativo && alvoSaida!=null){
    const diff = meta - alvoSaida;
    if(diff>0){ custoNaMeta={tipo:'extra',min:diff};
      avisos.push(`O dia fecha ${hm(alvoSaida)}. Ficar até ${c.metaSaida} gera ${diff}min de hora extra (evite).`);
    } else if(diff<0){ custoNaMeta={tipo:'desconto',min:-diff};
      if(faltaMeta===0) avisos.push(`O dia fecha ${hm(alvoSaida)}. Sair ${c.metaSaida} deixa ${-diff}min de desconto.`);
    } else if(cortadoMeta===0) avisos.push(`Hoje você fecha exatamente na sua meta ${c.metaSaida}. 👌`); }
  if(meta!=null && c.ativo && estagio===0)
    avisos.push(`Pra sair ${c.metaSaida} zerando o dia, entre até ${hm(meta-carga-c.almocoMin)} (almoço normal) ou, no limite, ${hm(meta-carga-c.almocoPiso)} (almoço mínimo).`);
  let saldoRealizadoMin=null;
  if(estagio===4){ const manha=A1-E, tarde=S-A2; saldoRealizadoMin=(manha+tarde)-carga; }
  let proximaAcao;
  if(estagio===0)proximaAcao={tipo:'bater_entrada',horario:plano.entrada};
  else if(estagio===1)proximaAcao={tipo:'sair_almoco',horario:plano.saidaAlmoco};
  else if(estagio===2)proximaAcao={tipo:'voltar_almoco',horario:plano.voltaAlmoco};
  else if(estagio===3)proximaAcao={tipo:'bater_saida',horario:plano.saida};
  else proximaAcao={tipo:'dia_fechado',horario:batidas.saida};
  return { estagio, plano, alvoSaida:alvoSaida!=null?hm(alvoSaida):null, almocoPlanejado:almoco,
    recuperado, restanteAtraso, cortadoMeta, faltaMeta, custoNaMeta, atrasoMin, adiantMin, saldoRealizadoMin, proximaAcao, avisos };
}

function situacaoAgora(plan, agoraMin){
  if(plan.estagio===4){
    const s=plan.saldoRealizadoMin;
    if(s>0) return {estado:'extra_fechado',min:s,txt:`Dia fechou com ${s}min de hora extra.`};
    if(s<0) return {estado:'desconto_fechado',min:-s,txt:`Dia fechou com ${-s}min de desconto.`};
    return {estado:'zerado',min:0,txt:'Dia fechou certinho — zero saldo. 🎯'};
  }
  const alvo=toMin(plan.alvoSaida);
  if(plan.estagio===3 && alvo!=null){
    const d=agoraMin-alvo;
    if(d>0) return {estado:'em_extra',min:d,txt:`⚠️ Passou do horário — ${d}min de EXTRA acumulando. Bata a saída!`};
    if(d>=-10) return {estado:'hora_de_sair',min:-d,txt:`Faltam ${-d}min pra saída exata (${plan.alvoSaida}).`};
    return {estado:'trabalhando',min:-d,txt:`Saída exata hoje: ${plan.alvoSaida}.`};
  }
  return {estado:'em_dia',min:0,txt:`Saída prevista pra zerar o dia: ${plan.alvoSaida||'--:--'}.`};
}

function load(){
  try{
    const s=JSON.parse(localStorage.getItem(LS));
    if(s&&s.cfg){
      const st={...defState(),...s,cfg:{...defState().cfg,...s.cfg},auth:{...defState().auth,...s.auth},hoje:{...defHoje(),...(s.hoje||{})}};
      if(st.hoje.data!==hojeStr()){ st.hoje=defHoje(); st.notificados={}; }
      return st;
    }
  }catch(e){}
  try{ // migração da v1: aproveita config, gateway e sessão
    const v1=JSON.parse(localStorage.getItem('pontoimp.v1'));
    if(v1&&v1.cfg){ const st=defState();
      st.cfg={...st.cfg,...v1.cfg}; delete st.cfg.lembrarPonto; delete st.cfg.metaSaida;
      st.gateway=v1.gateway||'';
      if(v1.token) st.auth.token=v1.token;
      if(v1.func) st.func={nome:v1.func.nome||'',empresa:v1.func.empresa||''};
      return st; }
  }catch(e){}
  return defState();
}
function save(){ localStorage.setItem(LS,JSON.stringify(S)); }
function hojeStr(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function nowMin(){ const d=new Date(); return d.getHours()*60+d.getMinutes(); }
function nowHM(){ const d=new Date(); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function diaSemana(){ return new Date().getDay(); }            // 0=dom .. 6=sáb
function ehFolga(){ const d=diaSemana(); return d===0||d===6; }
function cargaHojeMin(){ const d=diaSemana(); if(d===5) return S.cfg.cargaSex; if(d>=1&&d<=4) return S.cfg.cargaSegQui; return 0; }
function nomeDiaCarga(){ const d=diaSemana(); if(d===5) return 'sexta'; if(d>=1&&d<=4) return 'seg–qui'; return 'fim de semana'; }
// quanto antes do horário o aviso sai; 0 desliga os avisos prévios
function avisoAntesMin(){ const v=parseInt(S.cfg.avisoAntes); return Number.isFinite(v)&&v>=0?Math.min(v,60):10; }
function metaCfgHoje(){ const d=diaSemana(); if(d===5) return S.cfg.metaSex; if(d>=1&&d<=4) return S.cfg.metaSegQui; return ''; }
// o almoço previsto do dia e a meta de hoje entram como "padrão do dia" no motor
function cfgHoje(){ return {...S.cfg, cargaMin:cargaHojeMin(), metaSaida:(S.hoje.metaHoje||metaCfgHoje()||null),
  saidaAlmocoPadrao:(S.hoje.almocoPrevisto||S.cfg.saidaAlmocoPadrao)}; }

function gwUrl(){ return (S.gateway||'https://pontoimp-gateway.dener70.workers.dev').replace(/\/$/,''); }
function pushUrl(){ return (S.push||'https://pontoimp-push.dener70.workers.dev').replace(/\/$/,''); }
function api(path,opts){
  const o=opts||{};
  return fetch(gwUrl()+path,{...o,headers:{Authorization:'Bearer '+S.auth.token,
    ...(o.body?{'Content-Type':'application/json'}:{}), ...(o.headers||{})}});
}
const apiPost=(path,corpo)=>api(path,{method:'POST',body:JSON.stringify(corpo)});
function normalizaEspelho(data){
  const lista=(data&&(data.lista||data.Lista))||[];
  const nomes=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
  return lista.map(d=>{
    const raw=d.data||d.Data; const dt=raw?new Date(raw):null;
    const iso=dt?dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0'):'';
    // o Secullum manda "FALTA" (e outros rótulos) no lugar da hora quando não houve
    // registro. Só horário vale como batida — senão o motor acha que o dia fechou.
    const bat=((d.batidas||d.Batidas||[]).map(b=>String(b.valor||b.Valor||'').trim().slice(0,5))
      .filter(v=>EH_HORA.test(v)));
    return { iso, data:dt?String(dt.getDate()).padStart(2,'0')+'/'+String(dt.getMonth()+1).padStart(2,'0'):'',
      dia:dt?nomes[dt.getDay()]:'', bat, saldoStr:d.saldo||d.Saldo||'', fds:dt?(dt.getDay()===0||dt.getDay()===6):false };
  });
}

/* ---------- login persistente ---------- */
async function tentarLogin({banco,usuario,senha,tipo}){
  let r;
  try{
    r=await fetch(gwUrl()+'/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({banco,usuario,senha,tipo:tipo==='1'?'identificador':'folha'})});
  }catch(e){ return {ok:false,erro:'Gateway não respondeu — sem internet?'}; }
  let data={}; try{ data=await r.json(); }catch(e){}
  if(!r.ok) return {ok:false,erro:data.erro||('Erro '+r.status)};
  const f=data.func||{};
  return {ok:true,token:data.token,func:{nome:f.nome||'',empresa:f.empresa||''}};
}
async function doLogin(){
  const banco=$('#l_banco').value.trim(), usuario=$('#l_user').value.trim(),
        senha=$('#l_pass').value, tipo=$('#l_tipo').value,
        lembrar=$('#l_lembrar').classList.contains('on');
  if(!banco||!usuario||!senha){ toast('Preencha empresa, usuário e senha'); return; }
  pedirPermissaoSilenciosa();
  toast('Conectando ao Secullum…');
  const r=await tentarLogin({banco,usuario,senha,tipo});
  if(!r.ok){ toast(r.erro); return; }
  S.auth={banco,tipo,usuario,senha:lembrar?btoa(senha):'',token:r.token,lembrar};
  if(r.func.nome) S.func=r.func;
  save(); enterApp();
  toast('Conectado — '+(S.func.nome||'você'));
}
async function reloginSilencioso(){
  if(!S.auth.usuario||!S.auth.senha) return false;
  let senha=''; try{ senha=atob(S.auth.senha); }catch(e){ return false; }
  const r=await tentarLogin({banco:S.auth.banco,usuario:S.auth.usuario,senha,tipo:S.auth.tipo});
  if(!r.ok) return false;
  S.auth.token=r.token; if(r.func.nome) S.func=r.func; save(); return true;
}
function logout(){ S.auth.token=''; S.auth.senha=''; save(); location.reload(); }

/* ---------- sincronização: puxa as batidas do Secullum ---------- */
let syncing=false;
/* A inclusão manual pode estar desabilitada pelo empregador. Sem a flag ligada
   a rota recusa, então o botão não deve nem aparecer. */
let diagManual='ainda não consultei o Secullum.';
async function carregarPerfil(){
  try{
    const r=await api('/me');
    if(!r.ok){ diagManual=`não consegui ler a permissão — o gateway respondeu ${r.status}.`; render(); return; }
    const d=await r.json();
    const v=d.podeIncluirPontoManual;
    S.func.podeManual=(v===true);
    diagManual = v===true ? 'liberada — o ＋ aparece nas batidas que faltam, na aba Hoje.'
      : v===false ? 'desabilitada pela sua empresa no Secullum.'
      : 'o gateway respondeu, mas sem o campo podeIncluirPontoManual.';
    if(d.id) S.func.id=d.id;   // o ajuste de ponto exige funcionarioId no corpo
    S.perfil=d;                // permissões e telas liberadas, iguais às do app oficial
    if(d.nome) S.func.nome=d.nome;
    if(d.empresa) S.func.empresa=d.empresa;
    save(); render();
  }catch(e){ diagManual='não conectei no gateway pra checar.'; render(); }
}
// o espelho já traz as justificativas válidas; o formato não é fixo, aceitamos variações
function normalizaJustificativas(lista){
  return (Array.isArray(lista)?lista:[]).map(j=>({
    id: (j&&(j.id??j.Id)) ?? null,
    txt: String((j&&(j.descricao||j.Descricao||j.nome||j.Nome))||'').trim(),
  })).filter(j=>j.txt);
}

async function sincronizar(silencioso=true){
  if(!S.auth.token||syncing) return; syncing=true;
  try{
    if(S.hoje.data!==hojeStr()){ S.hoje=defHoje(); S.notificados={}; save(); }
    const d=hojeStr(); const rota=`/me/espelho?inicio=${d}&fim=${d}`;
    let r;
    try{ r=await api(rota); }catch(e){ setSync('offline'); return; }
    if(r.status===401){
      if(!(await reloginSilencioso())){ setSync('sessão expirada'); if(!silencioso) toast('Sessão expirou — entre de novo'); voltarLogin(); return; }
      try{ r=await api(rota); }catch(e){ setSync('offline'); return; }
    }
    if(!r.ok){ setSync('erro '+r.status); return; }
    let data=null; try{ data=JSON.parse(await r.text()); }catch(e){}
    if(!data){ setSync('resposta inválida'); return; }
    S.justificativas=normalizaJustificativas(data.justificativas||data.Justificativas);
    const dia=normalizaEspelho(data).find(x=>x.iso===d);
    const bat=(dia&&dia.bat)||[];
    const novas={ entrada:bat[0]||null, saidaAlmoco:bat[1]||null, voltaAlmoco:bat[2]||null, saida:bat[3]||null };
    const mudou=detectarMudancas(novas);
    Object.assign(S.hoje,novas);
    S.ultimaSyncMs=Date.now(); save(); setSync('ok');
    enviarAgenda();        // o plano pode ter mudado com a batida nova
    armarAlarmesNativos(); // e no APK os alarmes precisam ser remarcados
    if(!silencioso) toast('✓ Atualizado do Secullum');
    if(mudou||!silencioso) render();
  } finally { syncing=false; }
}
// nova batida detectada → o motor recalcula e avisa a consequência na hora
function detectarMudancas(novas){
  const antes=S.hoje; let mudou=false;
  const plan=planejarDia({...antes,...novas},cfgHoje());
  const msgs={
    entrada:()=> plan.atrasoMin>0
      ? `Entrada ${novas.entrada} — ${plan.atrasoMin}min de atraso. ${plan.restanteAtraso>0?`Almoço no mínimo e saída ${plan.plano.saida}.`:`Compenso no almoço (${hm(plan.almocoPlanejado)}).`}`
      : plan.adiantMin>0
      ? `Entrada ${novas.entrada} — ${plan.adiantMin}min adiantado. Saída exata ${plan.alvoSaida}.`
      : `Entrada ${novas.entrada}, em ponto. Saída exata ${plan.alvoSaida}.`,
    saidaAlmoco:()=>`Almoço batido ${novas.saidaAlmoco}. Volte às ${plan.plano.voltaAlmoco} (almoço de ${hm(plan.almocoPlanejado)}).`,
    voltaAlmoco:()=>`Volta batida ${novas.voltaAlmoco}. Saída exata pra zerar: ${plan.alvoSaida}.`,
    saida:()=>{ const s=plan.saldoRealizadoMin;
      return s===0?`Dia fechado às ${novas.saida} — zerado! 🎯`
        : s>0?`Dia fechado às ${novas.saida} — ficou ${s}min de hora EXTRA.`
        : `Dia fechado às ${novas.saida} — ${-s}min de desconto.`; }
  };
  for(const k of ['entrada','saidaAlmoco','voltaAlmoco','saida']){
    if(novas[k]&&novas[k]!==antes[k]){
      mudou=true;
      const K=hojeStr()+'|bat_'+k+'_'+novas[k];
      if(!S.notificados[K]){ S.notificados[K]=1; notificar('PontoImp — ponto detectado', msgs[k](), K); }
    }
    if(!novas[k]&&antes[k]) mudou=true; // batida corrigida/removida no Secullum
  }
  return mudou;
}
function setSync(st){
  const p=$('#syncPill'); if(!p) return;
  if(st==='ok'){ p.className='pill ok';
    p.textContent='● '+new Date(S.ultimaSyncMs).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}); }
  else if(st==='—'){ p.className='pill mut'; p.textContent='—'; }
  else { p.className='pill warn'; p.textContent=st; }
}

/* =====================================================================
   ALARMES — avisa no momento certo, conforme o estágio do dia
   ===================================================================== */
function eventosDoDia(plan){
  const ev=[];
  if(ehFolga()) return ev;
  const est=plan.estagio;
  if(est===0){
    const e=toMin(S.cfg.entradaPadrao);
    const av=avisoAntesMin();
    ev.push({chave:'ent_pre',min:e-av,titulo:`🏢 Entrada em ${av} min`,corpo:`Registre a entrada até ${S.cfg.entradaPadrao} pra não abrir atraso.`});
    ev.push({chave:'ent',min:e,titulo:'🏢 Hora de entrar',corpo:`Entrada padrão ${S.cfg.entradaPadrao}.`,nivel:'alarme'});
  } else if(est===1){
    const alvo=S.hoje.snoozeAte!=null?S.hoje.snoozeAte:toMin(plan.plano.saidaAlmoco);
    if(!S.hoje.perguntaFeita)
      ev.push({chave:'alm_ask_'+alvo,min:alvo-avisoAntesMin(),titulo:'🍽️ Almoço às '+hm(alvo),corpo:'Vai no padrão, mais tarde ou outro horário? Toque pra escolher.',acao:'almoco'});
    ev.push({chave:'alm_'+alvo,min:alvo,titulo:'🍽️ Hora do almoço',corpo:`Saída planejada ${hm(alvo)}. Bom apetite!`,nivel:'alarme'});
  } else if(est===2){
    const v=toMin(plan.plano.voltaAlmoco);
    const av2=avisoAntesMin();
    ev.push({chave:'volta_pre_'+v,min:v-av2,titulo:`💼 Volta em ${av2} min`,corpo:`Volta às ${plan.plano.voltaAlmoco} — almoço de ${hm(plan.almocoPlanejado)} hoje.`});
    ev.push({chave:'volta_'+v,min:v,titulo:'💼 Hora de voltar',corpo:`Registre a volta às ${plan.plano.voltaAlmoco} pra fechar certinho.`,nivel:'alarme'});
  } else if(est===3){
    const s=toMin(plan.alvoSaida);
    const av3=avisoAntesMin();
    ev.push({chave:'sai_pre_'+s,min:s-av3,titulo:`🏁 Saída em ${av3} min`,corpo:`Saída exata ${plan.alvoSaida} zera o dia.`});
    // um segundo toque na reta final, quando o primeiro aviso é folgado
    if(av3>=10) ev.push({chave:'sai_pre5_'+s,min:s-5,titulo:'🏁 Saída em 5 min',corpo:`Vai fechando — ${plan.alvoSaida}.`});
    ev.push({chave:'sai_'+s,min:s,titulo:'🏁 SAIA AGORA',corpo:`${plan.alvoSaida} — cada minuto a mais vira hora extra.`,nivel:'alarme'});
    for(let k=5;k<=30;k+=5)
      ev.push({chave:'extra_'+s+'_'+k,min:s+k,titulo:'⚠️ Hora extra acumulando',corpo:`Já passaram ${k}min do fechamento. Registre a saída!`,nivel:'alarme'});
  }
  return ev;
}
function checarAvisos(){
  if(!S.cfg.alarmes||!S.auth.token||ehFolga()) return;
  // no APK a mesma agenda já está no AlarmManager (alarmes e avisos): tocar
  // daqui também era o alarme dobrado — sirene da página + despertador nativo
  if(temPonteNativa()) return;
  const plan=planejarDia(S.hoje,cfgHoje());
  const agora=nowMin();
  for(const e of eventosDoDia(plan)){
    if(e.min==null) continue;
    const K=hojeStr()+'|'+e.chave;
    if(agora>=e.min&&agora<=e.min+4&&!S.notificados[K]){ // janela de 5min segura contra throttling
      S.notificados[K]=1; save();
      notificar(e.titulo,e.corpo,K,e.nivel);
      if(e.acao==='almoco') abrirPerguntaAlmoco();
    }
  }
}
function ehIOS(){ return /iphone|ipad|ipod/i.test(navigator.userAgent)
  ||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1); } // iPad novo se diz Mac
function ehInstalado(){ try{ return matchMedia('(display-mode: standalone)').matches||navigator.standalone===true; }
  catch(e){ return false; } }

// motivo de as notificações não funcionarem aqui — null quando está tudo certo
function porQueSemNotificacao(){
  if(!window.isSecureContext) return 'Só funciona em HTTPS — abra pelo endereço publicado, não pelo arquivo salvo.';
  if(!('Notification'in window)) return ehIOS()
    ? 'No iPhone só rola com o app instalado na tela inicial (iOS 16.4+): Compartilhar → Adicionar à Tela de Início.'

  if(Notification.permission==='denied') return 'Notificações bloqueadas. Libere nas permissões do site — daqui não dá pra perguntar de novo.';
  return null;
}
/* ---------- push do servidor: o aviso chega com o app fechado ---------- */
function b64urlParaBytes(s){
  s=String(s).replace(/-/g,'+').replace(/_/g,'/'); while(s.length%4) s+='=';
  const bin=atob(s), out=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) out[i]=bin.charCodeAt(i);
  return out;
}
async function inscricaoPush(){
  if(!('serviceWorker'in navigator)||!('PushManager'in window)) return null;
  const reg=await navigator.serviceWorker.ready;
  return reg.pushManager.getSubscription();
}
/* Avisos de hoje em timestamp absoluto: o Worker não precisa saber
   nada de fuso nem das regras de ponto, só entregar na hora. */
function agendaDeHoje(){
  if(!S.cfg.alarmes||ehFolga()) return [];
  const plan=planejarDia(S.hoje,cfgHoje());
  const meiaNoite=new Date(); meiaNoite.setHours(0,0,0,0);
  const limite=Date.now()-60000;
  return eventosDoDia(plan).filter(e=>e.min!=null)
    .map(e=>({ ts:meiaNoite.getTime()+e.min*60000, chave:hojeStr()+'|'+e.chave,
               titulo:e.titulo, corpo:e.corpo, nivel:e.nivel==='alarme'?'alarme':'aviso' }))
    .filter(e=>e.ts>limite);
}
/* Dentro do APK existe uma ponte nativa: a mesma agenda que vai pro push é

/* Os alarmes só eram marcados pro dia de hoje, então um dia sem abrir o app
   ficava sem alarme nenhum. Marcamos os próximos dias úteis adiantado, com o
   horário padrão — quando o app abrir de novo, refina com as batidas reais.
   Isso resolve sem serviço em segundo plano, que custaria bateria e notificação
   permanente pra fazer o que o AlarmManager já faz sozinho. */
function agendaFutura(dias=10){
  if(!S.cfg.alarmes) return [];
  const out=[]; const base=new Date(); base.setHours(0,0,0,0);
  for(let d=1;d<=dias;d++){
    const dt=new Date(base); dt.setDate(dt.getDate()+d);
    const wd=dt.getDay(); if(wd===0||wd===6) continue;          // folga não tem carga
    const iso=dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
    const p=planejarDia({},cfgDoDia(iso));                      // dia limpo: plano padrão
    const meia=dt.getTime();
    const av=avisoAntesMin();
    [['ent','🏢 Hora de entrar',p.plano.entrada],
     ['alm','🍽️ Hora do almoço',p.plano.saidaAlmoco],
     ['volta','💼 Hora de voltar',p.plano.voltaAlmoco],
     ['sai','🏁 SAIA AGORA',p.alvoSaida]].forEach(([k,titulo,hora])=>{
      const m=toMin(hora||''); if(m==null) return;
      const corpo='Previsto pelo seu padrão — abra o app pra conferir com as batidas do dia.';
      out.push({ ts:meia+m*60000, chave:iso+'|'+k, titulo, corpo, nivel:'alarme' });
      // o mesmo adiantamento configurado vale pros dias futuros
      if(av>0) out.push({ ts:meia+(m-av)*60000, chave:iso+'|'+k+'_pre',
        titulo:titulo.replace(/^(\S+)\s.*/,'$1')+` em ${av} min`, corpo, nivel:'aviso' });
    });
  }
  return out;
}

let ultimaAgenda=''; // evita repostar a mesma agenda a cada sincronização
async function enviarAgenda(inscricao,forcar){
  if(!S.pushInscrito) return false;
  try{
    const i=inscricao||await inscricaoPush();
    if(!i) return false;
    const agenda=agendaDeHoje();
    const marca=JSON.stringify(agenda.map(e=>e.chave+'@'+e.ts));
    if(!forcar&&marca===ultimaAgenda) return true;
    const r=await fetch(pushUrl()+'/push/agenda',{ method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({ inscricao:i.toJSON(), agenda }) });
    if(r.ok) ultimaAgenda=marca;
    return r.ok;
  }catch(e){ return false; }
}
async function assinarPush(){
  const motivo=porQueSemNotificacao();
  if(motivo) return toast(motivo),false;
  if(!('PushManager'in window)) return toast('Este navegador não suporta push.'),false;
  if(Notification.permission!=='granted'){ await pedirPermissao(); if(Notification.permission!=='granted') return false; }
  try{
    const r=await fetch(pushUrl()+'/push/chave');
    if(!r.ok) return toast('Serviço de push fora do ar ('+r.status+').'),false;
    const { publica }=await r.json();
    if(!publica) return toast('O serviço de push está sem chave VAPID configurada.'),false;
    const reg=await navigator.serviceWorker.ready;
    const insc=(await reg.pushManager.getSubscription())
      || await reg.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey:b64urlParaBytes(publica) });
    // o service worker lê isto se o navegador trocar a inscrição sozinho
    try{ const c=await caches.open('pontoimp-cfg'); await c.put('./__push_url', new Response(pushUrl())); }catch(e){}
    S.pushInscrito=true; save();
    const ok=await enviarAgenda(insc);
    toast(ok?'✓ Push ligado — te aviso com o app fechado.':'Inscrito, mas o servidor não aceitou a agenda.');
    atualizarDiagNotif();
    return ok;
  }catch(e){ toast('Não deu pra ligar o push: '+(e.message||e)); return false; }
}
async function cancelarPush(){
  try{
    const i=await inscricaoPush();
    if(i){
      await fetch(pushUrl()+'/push/cancelar',{ method:'POST', headers:{'Content-Type':'application/json'},
        body:JSON.stringify({ endpoint:i.endpoint }) }).catch(()=>{});
      await i.unsubscribe();
    }
  }catch(e){}
  S.pushInscrito=false; save(); atualizarDiagNotif(); toast('Push desligado.');
}
async function testarPush(){
  const i=await inscricaoPush();
  if(!i) return toast('Ligue o push primeiro.');
  try{
    const r=await fetch(pushUrl()+'/push/teste',{ method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({ inscricao:i.toJSON() }) });
    toast(r.ok?'Enviado — deve chegar em segundos.':'O servidor recusou ('+r.status+').');
  }catch(e){ toast('Não conectou no serviço de push.'); }
}

/* ---------- som: bipe simples (avisos) e SIRENE em loop (alarme) ---------- */
let audioCtx=null;
function garantirAudio(){ try{
  if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==='suspended') audioCtx.resume();
}catch(e){} }
document.addEventListener('pointerdown',garantirAudio,{capture:true}); // navegador exige gesto pra liberar som
function tocarTom(freq,ini,dur,vol){ if(!audioCtx) return;
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.connect(g); g.connect(audioCtx.destination);
  o.type='square'; o.frequency.value=freq;
  const t=audioCtx.currentTime+ini;
  g.gain.setValueAtTime(.001,t);
  g.gain.exponentialRampToValueAtTime(vol,t+.02);
  g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.start(t); o.stop(t+dur+.05); }
function beep(){ garantirAudio(); tocarTom(880,0,.5,.25); }
function sirene(){ garantirAudio(); tocarTom(988,0,.28,.5); tocarTom(660,.32,.28,.5); tocarTom(988,.64,.28,.5); }

/* ---------- ALARME de verdade: sirene em loop + vibração + tela, até desligar ---------- */
let alarmeAtivo=null;
function dispararAlarme(titulo,corpo){
  pararAlarme();
  const ov=$('#alarmOverlay'); if(!ov) return;
  $('#alarmTitulo').textContent=titulo; $('#alarmCorpo').textContent=corpo;
  ov.classList.remove('hidden');
  const loop=()=>{ sirene(); try{ if(navigator.vibrate) navigator.vibrate([420,140,420]); }catch(e){} };
  loop();
  alarmeAtivo={ timer:setInterval(loop,1500), fim:setTimeout(pararAlarme,120000) }; // desliga sozinho em 2min
}
function pararAlarme(){
  if(alarmeAtivo){ clearInterval(alarmeAtivo.timer); clearTimeout(alarmeAtivo.fim); alarmeAtivo=null; }
  try{ if(navigator.vibrate) navigator.vibrate(0); }catch(e){}
  const ov=$('#alarmOverlay'); if(ov) ov.classList.add('hidden');
}
async function notificar(titulo,corpo,tag,nivel){
  // no APK quem toca é o lado nativo; a página só avisa na tela, sem som
  if(temPonteNativa()){ toast(titulo+' — '+corpo); return; }
  const alarme=(nivel==='alarme'&&S.cfg.modoAlarme);
  if(alarme) dispararAlarme(titulo,corpo); else beep();
  try{
    if('Notification'in window&&Notification.permission==='granted'){
  const opts={body:corpo,icon:'icon-192-v2.png',badge:'icon-192-v2.png',tag:tag||titulo,renotify:true,
        requireInteraction:alarme,vibrate:alarme?[420,140,420,140,420,140,420]:[200]};
      const reg=('serviceWorker'in navigator)?await navigator.serviceWorker.getRegistration():null;
      if(reg&&reg.showNotification) reg.showNotification(titulo,opts);
  else new Notification(titulo,{body:corpo,icon:'icon-192-v2.png'});
    }
  }catch(e){}
  toast(titulo+' — '+corpo);
}

/* =====================================================================
   INCONSISTÊNCIAS — justifica marcação faltando ou errada
   O contrato é um round-trip: o objeto vem do GET, a gente só preenche
   a justificativa e devolve inteiro. Por isso não interpretamos o schema
   — mexer nele seria inventar campo que o Secullum não pediu.
   ===================================================================== */
let inconsistencias=[];   // como vieram do gateway, sem alterar
let justificando=null;

async function carregarInconsistencias(){
  if(!S.auth.token) return;
  const fim=hojeStr();
  const d=new Date(); d.setDate(d.getDate()-30);
  const ini=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  try{
    let r=await api(`/me/inconsistencias?inicio=${ini}&fim=${fim}&status=0`);
    // gateway sem a rota dedicada: a escotilha /me/raw já existe e é GET, então
    // a listagem funciona sem precisar publicar nada. Só o envio exige o patch.
    if(r.status===404)
      r=await api('/me/raw?endpoint='+encodeURIComponent(`/Inconsistencias/${ini}/${fim}/0`));
    if(!r.ok){ inconsistencias=[]; return; }
    const j=await r.json();
    inconsistencias=Array.isArray(j)?j:(Array.isArray(j&&j.lista)?j.lista:[]);
    render();
  }catch(e){ inconsistencias=[]; }
}

/* Casa a pendência do Secullum com a linha do dia no histórico, pra você
   justificar olhando o dia errado em vez de caçar num card separado. */
function incDoDia(iso){
  return inconsistencias.findIndex(i=>String(i.data||i.Data||'').slice(0,10)===iso);
}

// o schema não é fixo; mostramos o que der e nunca quebramos por campo ausente
const descreverInc=(i)=>{
  const dt=String(i.data||i.Data||'').slice(0,10);
  const txt=i.descricao||i.Descricao||i.motivo||i.Motivo||i.tipo||i.Tipo||'inconsistência';
  return { data: dt?dt.split('-').reverse().join('/'):'—', txt:String(txt) };
};

function abrirJustificar(idx,iso){
  const inc=inconsistencias[idx];
  // sem pendência apontada não há o que enviar: o POST devolve o objeto que
  // veio do Secullum, e num dia sem inconsistência esse objeto não existe
  if(!inc) return toast(iso
    ? `O Secullum não apontou pendência em ${dataBR(iso)}. Justificativa só vale sobre pendência que ele marcou.`
    : 'Nenhuma pendência selecionada.');
  justificando=idx;
  const d=descreverInc(inc);
  $('#jusTxt').textContent=`${d.data} — ${d.txt}`;
  const sel=$('#jusSel');
  sel.innerHTML=S.justificativas.length
    ? S.justificativas.map(j=>`<option value="${j.txt.replace(/"/g,'&quot;')}">${j.txt}</option>`).join('')
    : '<option value="">(o Secullum não mandou lista)</option>';
  $('#jusLivre').value='';
  $('#sheetJus').classList.remove('hidden');
}
function fecharJustificar(){ $('#sheetJus').classList.add('hidden'); justificando=null; }

async function confirmarJustificativa(){
  if(justificando==null) return;
  const texto=($('#jusLivre').value.trim()||$('#jusSel').value||'').trim();
  if(!texto) return toast('Escolha ou escreva uma justificativa.');
  const btn=$('#jusBtn'); btn.disabled=true; btn.textContent='Enviando…';
  try{
    // devolve o objeto original intacto, só com a justificativa preenchida
    const corpo={...inconsistencias[justificando], justificativa:texto};
    let r=await apiPost('/me/inconsistencia',corpo);
    if(r.status===401&&await reloginSilencioso()) r=await apiPost('/me/inconsistencia',corpo);
    if(!r.ok){
      // 404 aqui é o gateway sem a rota, não o Secullum recusando — dizer a
      // coisa certa evita procurar problema no lugar errado
      if(r.status===404) return toast('O gateway ainda não tem a rota de envio. Falta aplicar o patch de inconsistências.');
      let msg=''; try{ const j=await r.json(); msg=j.erro||j.mensagem||''; }catch(e){}
      toast(msg?('Recusado: '+msg):('O Secullum recusou ('+r.status+').'));
      return;
    }
    fecharJustificar();
    toast('Justificativa enviada — vai pra aprovação do gestor.');
    await carregarInconsistencias();
  }catch(e){ toast('Não conectou pra enviar: '+(e.message||e)); }
  finally{ btn.disabled=false; btn.textContent='Enviar justificativa'; }
}

/* =====================================================================
   PONTO MANUAL — inclui a batida que faltou
   O horário sugerido é o que o motor já planejou pro slot, que é por
   construção o que fecha o dia zerado. Grava no cartão de verdade, então
   a tela mostra o efeito no saldo e exige confirmação explícita.
   ===================================================================== */
let incluindo=null; // {dataIso}

/* Config e batidas de um dia qualquer, não só de hoje: a batida que faltou
   quase sempre é percebida no dia seguinte. */
function cfgDoDia(iso){
  const wd=new Date(iso+'T12:00:00').getDay();
  const carga=wd===5?S.cfg.cargaSex:(wd>=1&&wd<=4?S.cfg.cargaSegQui:0);
  const meta=wd===5?S.cfg.metaSex:(wd>=1&&wd<=4?S.cfg.metaSegQui:'');
  return {...S.cfg, cargaMin:carga, metaSaida:meta||null};
}
function batidasDoDia(iso){
  if(iso===hojeStr()) return {...S.hoje};
  const d=(S.hist.dias||[]).find(x=>x.iso===iso);
  const b=(d&&d.bat)||[];
  return { entrada:b[0]||null, saidaAlmoco:b[1]||null, voltaAlmoco:b[2]||null, saida:b[3]||null };
}
const dataBR=(iso)=>iso.split('-').reverse().join('/');

/* O Secullum ajusta o dia inteiro numa solicitação só: entrada1..5 e saida1..5,
   mais uma observação. Formato confirmado por captura da Central. */
const PARES=[1,2,3,4,5];
function abrirIncluir(campo,dataIso){
  const iso=dataIso||hojeStr();
  const bat=batidasDoDia(iso);
  const plan=planejarDia(bat,cfgDoDia(iso));
  incluindo={ dataIso:iso };
  $('#incTitulo').textContent=dataBR(iso);

  // as quatro batidas do nosso motor viram os dois primeiros pares do Secullum
  const atual={ entrada1:bat.entrada, saida1:bat.saidaAlmoco,
                entrada2:bat.voltaAlmoco, saida2:bat.saida };
  // o que falta vem sugerido pelo motor, que é o horário que zera o dia
  const sug={ entrada1:plan.plano.entrada, saida1:plan.plano.saidaAlmoco,
              entrada2:plan.plano.voltaAlmoco, saida2:plan.plano.saida };

  $('#incPares').innerHTML=PARES.map(n=>`
    <div class="parPonto">
      <div class="field" style="margin:0"><label>Entrada ${n}</label>
        <input id="e${n}" type="time" value="${atual['entrada'+n]||''}"
          data-sug="${sug['entrada'+n]||''}" oninput="atualizarPreviaInclusao()"></div>
      <div class="field" style="margin:0"><label>Saída ${n}</label>
        <input id="s${n}" type="time" value="${atual['saida'+n]||''}"
          data-sug="${sug['saida'+n]||''}" oninput="atualizarPreviaInclusao()"></div>
    </div>`).join('');
  $('#incObs').value='';
  atualizarPreviaInclusao();
  $('#sheetInc').classList.remove('hidden');
}

/** Preenche os vazios com o que o motor planejou — sem sobrescrever o que existe. */
function sugerirHorarios(){
  let n=0;
  PARES.forEach(i=>['e','s'].forEach(p=>{
    const el=$('#'+p+i);
    if(el&&!el.value&&el.dataset.sug){ el.value=el.dataset.sug; n++; }
  }));
  atualizarPreviaInclusao();
  toast(n?`${n} horário${n>1?'s':''} preenchido${n>1?'s':''} pelo motor.`:'Nada a sugerir: o dia já está completo.');
}

function lerPares(){
  const o={};
  PARES.forEach(n=>{
    const e=$('#e'+n)?.value||'', s=$('#s'+n)?.value||'';
    o['entrada'+n]=EH_HORA.test(e)?e:null;
    o['saida'+n]=EH_HORA.test(s)?s:null;
  });
  return o;
}
function fecharIncluir(){ $('#sheetInc').classList.add('hidden'); incluindo=null; }

/* Mostra o que aquele horário faz com o saldo — é a informação que importa
   na hora de decidir, e some se o campo estiver inválido. */
function atualizarPreviaInclusao(){
  if(!incluindo) return;
  const alvo=$('#incPrevia'); const p=lerPares();
  // o motor entende os dois primeiros pares; os demais o Secullum conta na boa
  const sim={ entrada:p.entrada1, saidaAlmoco:p.saida1, voltaAlmoco:p.entrada2, saida:p.saida2 };
  const plano=planejarDia(sim,cfgDoDia(incluindo.dataIso));
  const s=plano.saldoRealizadoMin;
  alvo.textContent = plano.estagio===4
    ? (s===0?'Assim o dia fecha zerado.'
      : s>0?`Assim o dia fecha com ${s}min de extra.`
           : `Assim o dia fecha com ${-s}min de desconto.`)
    : `Faltam batidas: a saída que zera o dia seria ${plano.alvoSaida}.`;
}

async function confirmarInclusao(){
  if(!incluindo) return;
  const pares=lerPares();
  if(!Object.values(pares).some(Boolean)) return toast('Preencha ao menos um horário.');
  const obs=$('#incObs').value.trim();
  if(!obs) return toast('Escreva uma observação — é o que o gestor lê pra aprovar.');
  const btn=$('#incBtn'); btn.disabled=true; btn.textContent='Enviando…';
  try{
    // formato confirmado por captura da Central do Funcionário: tipo 0 = ajuste
    // de ponto, e o dia inteiro vai numa solicitação só
    const corpo={ data:`${incluindo.dataIso}T00:00:00`, funcionarioId:S.func.id||null,
      solicitanteId:null, justificativaId:null, ...pares,
      filtro1Id:null, filtro2Id:null, periculosidade:null, versao:null,
      tipo:0, observacoes:obs, dados:null, foto:null, temFoto:false,
      registroPendente:false, existePeriodoEncerrado:false, tipoAusencia:0,
      dataSolicitacao:null, feriasVendaDias:null };
    let r=await apiPost('/me/solicitacao',corpo);
    if(r.status===401&&await reloginSilencioso()) r=await apiPost('/me/solicitacao',corpo);
    if(!r.ok){
      if(r.status===404) return toast('O gateway ainda não tem a rota /me/solicitacao. Falta aplicar as rotas no worker.');
      let msg='';
      try{ const j=await r.json(); msg=j.erro||j.mensagem||''; }catch(e){}
      toast(msg?('Recusado: '+msg):('O Secullum recusou ('+r.status+').'));
      return;
    }
    fecharIncluir();
    toast('Ajuste enviado — vai pra aprovação do gestor.');
    await sincronizar(false); // a fonte da verdade continua sendo o espelho
  }catch(e){ toast('Não conectou pra enviar: '+(e.message||e)); }
  finally{ btn.disabled=false; btn.textContent='Enviar ajuste'; }
}

/* =====================================================================
   RECURSOS DO APP OFICIAL — o que o Secullum RH faz além do espelho
   Rotas, corpos e enums tirados do bytecode do app 1.45.0 (detalhes e
   evidência em docs/rotas-secullum.md). Tudo passa por /me/api do
   gateway, que só aceita as rotas que o próprio app oficial chama.
   ===================================================================== */
const esc=(v)=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isoDe=(d)=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const diasAtras=(n)=>{ const d=new Date(); d.setDate(d.getDate()-n); return isoDe(d); };
// o Secullum devolve "2026-10-20T00:00:00"; na tela vale só o dia
const dataSec=(v)=>{ const t=String(v||'').slice(0,10); return /^\d{4}-\d{2}-\d{2}$/.test(t)?dataBR(t):(v?String(v):'—'); };
const dataHoraSec=(v)=>{ const d=v?new Date(v):null; return d&&!isNaN(d)
  ? d.toLocaleDateString('pt-BR')+' '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}) : '—'; };
// formatIsoDate do app: hora local com o "Z" literal — é o que o servidor espera
const isoSec=(iso)=>iso+'T00:00:00.000Z';

async function sec(metodo,rota,corpo){
  const f=()=>apiPost('/me/api',{metodo,rota,corpo});
  let r=await f();
  if(r.status===401&&await reloginSilencioso()) r=await f();
  return r;
}
/* O Secullum responde erro de validação como [{message}] e os demais como
   {message}; o gateway, como {erro}. 404 com "rota não encontrada" é o
   gateway antigo, sem /me/api — dizer isso poupa procurar no lugar errado. */
async function msgErro(r){
  let t=''; try{ t=await r.text(); }catch(e){}
  let j=null; try{ j=JSON.parse(t); }catch(e){}
  if(r.status===404&&j&&j.erro==='rota não encontrada')
    return 'O gateway ainda não tem as telas novas — falta publicar o worker de patches/.';
  if(Array.isArray(j)&&j.length) return j.map(x=>(x&&(x.message||x.mensagem))||x).join(' ');
  if(j&&(j.message||j.mensagem||j.erro)) return j.message||j.mensagem||j.erro;
  if(typeof j==='string'&&j) return j;
  return t&&t.length<200?t:('O Secullum respondeu '+r.status+'.');
}
async function secJson(metodo,rota,corpo){
  const r=await sec(metodo,rota,corpo);
  if(!r.ok) throw new Error(await msgErro(r));
  const t=await r.text(); if(!t) return null;
  try{ return JSON.parse(t); }catch(e){ return t; }
}
/* PDF, comprovante e arquivo do RH. No navegador vira download; no APK a
   WebView não baixa blob, então os bytes vão pela ponte pro leitor do Android. */
async function secArquivo(rota,nome){
  toast('Baixando…');
  const r=await sec('GET',rota);
  if(!r.ok) throw new Error(await msgErro(r));
  abrirBlob(await r.blob(),nome);
}
function abrirBlob(blob,nome){
  if(typeof AndroidAlarme!=='undefined'&&typeof AndroidAlarme.abrirArquivo==='function'){
    const fr=new FileReader();
    fr.onload=()=>AndroidAlarme.abrirArquivo(nome,String(fr.result).split(',')[1]||'',blob.type||'');
    fr.readAsDataURL(blob); return;
  }
  const url=URL.createObjectURL(blob), a=document.createElement('a');
  a.href=url; a.download=nome; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),60000);
}
const extDe=(mime)=>/pdf/.test(mime)?'.pdf':/png/.test(mime)?'.png':/jpe?g/.test(mime)?'.jpg':/html/.test(mime)?'.html':/text/.test(mime)?'.txt':'';
async function tentar(fn,okMsg){
  try{ await fn(); if(okMsg) toast(okMsg); return true; }
  catch(e){ toast(e.message||String(e)); return false; }
}

/* ---------- sheet genérica ---------- */
function abrirSheetX(html){ $('#sheetXBox').innerHTML=html; $('#sheetX').classList.remove('hidden'); }
function fecharSheetX(){ $('#sheetX').classList.add('hidden'); $('#sheetXBox').innerHTML=''; fecharCamera(); }
// botão que trava enquanto a chamada roda: evita mandar duas vezes a mesma coisa
async function comBotao(btn,fn){
  if(!btn||btn.disabled) return;
  const txt=btn.textContent; btn.disabled=true; btn.textContent='Enviando…';
  try{ await fn(); } finally{ if(btn.isConnected){ btn.disabled=false; btn.textContent=txt; } }

/* ---------- aparelho: localização, endereço e câmera ---------- */
function idDispositivo(){
  if(!S.dispositivoId){
    S.dispositivoId=(crypto.randomUUID?crypto.randomUUID():Date.now().toString(16)+Math.random().toString(16).slice(2));
    save();
  }
  return S.dispositivoId;
}
function posicaoAtual(){
  return new Promise((ok,falha)=>{
    if(!navigator.geolocation) return falha(new Error('Este aparelho não informa a localização.'));
    navigator.geolocation.getCurrentPosition(
      p=>ok({latitude:p.coords.latitude,longitude:p.coords.longitude,precisao:p.coords.accuracy}),
      e=>falha(new Error(e.code===1?'Localização negada — libere a permissão de localização do app.'
        :'Não consegui a localização ('+(e.message||e.code)+'). Ligue o GPS e tente de novo.')),
      {enableHighAccuracy:true,timeout:25000,maximumAge:0});
  });
}
// mesmo serviço que o app oficial usa; sem ele o campo vai vazio, que o Secullum aceita
async function enderecoDe(c){
  try{
    const r=await api(`/me/endereco?lat=${c.latitude}&lng=${c.longitude}`);
    if(!r.ok) return null;
    const j=await r.json();
    return (j&&(j.endereco||j.Endereco))||null;
  }catch(e){ return null; }
}
let camStream=null;
async function ligarCamera(video,frontal=true){
  fecharCamera();
  camStream=await navigator.mediaDevices.getUserMedia({audio:false,
    video:{facingMode:frontal?'user':'environment',width:{ideal:720}}});
  video.srcObject=camStream; await video.play();
}
function fecharCamera(){ if(camStream){ camStream.getTracks().forEach(t=>t.stop()); camStream=null; } }
// o app oficial manda JPEG em base64 sem o prefixo data:, comprimido pela metade
function quadroJpeg(fonte,largura,altura){
  const k=Math.min(1,1024/Math.max(largura,altura));
  const c=document.createElement('canvas'); c.width=Math.round(largura*k); c.height=Math.round(altura*k);
  c.getContext('2d').drawImage(fonte,0,0,c.width,c.height);
  return c.toDataURL('image/jpeg',.5).split(',')[1];
}
function fotografar(video){ return quadroJpeg(video,video.videoWidth||640,video.videoHeight||480); }
function jpegDeArquivo(file){
  return new Promise((ok,falha)=>{
    if(!file) return falha(new Error('Nenhuma imagem escolhida.'));
    const img=new Image(), url=URL.createObjectURL(file);
    img.onload=()=>{ URL.revokeObjectURL(url); ok(quadroJpeg(img,img.naturalWidth,img.naturalHeight)); };
    img.onerror=()=>{ URL.revokeObjectURL(url); falha(new Error('Não consegui ler essa imagem.')); };
    img.src=url;
  });
}

/* ---------- perímetro: a mesma conta do validarBatidaDentroPerimetro ----------
   O app oficial avisa o Secullum quando a batida sai da cerca da empresa. Sem
   repetir a conta, o PontoImp mandaria sempre "dentro" e furaria o controle. */
function distanciaM(a,b){
  const R=6371000, rad=(x)=>x*Math.PI/180;
  const dLat=rad(b.lat-a.lat), dLng=rad(b.lng-a.lng);
  const h=Math.sin(dLat/2)**2+Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
function dentroDoPerimetro(lat,lng,perimetros){
  return (perimetros||[]).some(p=>{
    const cs=(p&&p.coordenadas)||[];
    if(p.circulo&&p.radius) return cs[0]?distanciaM({lat,lng},cs[0])<=p.radius:false;
    let dentro=false;   // ponto no polígono, por paridade de cruzamentos
    for(let i=0,j=cs.length-1;i<cs.length;j=i++){
      const a=cs[i], b=cs[j];
      if((a.lng>lng)!==(b.lng>lng) && lat<(b.lat-a.lat)*(lng-a.lng)/(b.lng-a.lng)+a.lat) dentro=!dentro;
    }
    return dentro;
  });
}

/* =====================================================================
   REGISTRAR PONTO — o "bater ponto" do app oficial (POST /IncluirPonto)
   A hora é do servidor: o corpo não leva dataHora, então não há como
   registrar outro horário daqui. Localização é a real do aparelho.
   ===================================================================== */
let regPonto=null;
function botaoRegistrar(){
  if(!S.func.podeManual) return '';
  return `<button class="btn regGrande" onclick="abrirRegistrarPonto()">🕘 Registrar ponto</button>`;
}
async function abrirRegistrarPonto(){
  regPonto={info:null,coords:null,endereco:null,foto:null,erroGps:null,pronto:false};
  desenharRegistro();
  // as duas consultas não dependem uma da outra
  const pInfo=secJson('GET','/IncluirPonto').then(i=>{ regPonto&&(regPonto.info=i||{}); })
    .catch(()=>{ regPonto&&(regPonto.info={}); });
  const pGps=posicaoAtual().then(async c=>{ if(!regPonto) return;
      regPonto.coords=c; desenharRegistro(); regPonto.endereco=await enderecoDe(c); })
    .catch(e=>{ regPonto&&(regPonto.erroGps=e.message); });
  await Promise.all([pInfo,pGps]);
  if(!regPonto) return;
  regPonto.pronto=true; desenharRegistro();
  if(exigeFoto()) ligarCameraRegistro();
}
// a exigência pode vir na consulta da inclusão ou no cadastro do funcionário
function cfgInclusao(){
  const i=(regPonto&&regPonto.info)||{};
  return {...((S.perfil&&S.perfil.configuracoesIncluirPontoOffline)||{}),...(i.configuracoesIncluirPontoOffline||{}),...i};
}
function exigeFoto(){ return !!cfgInclusao().exigirCapturaFotoPonto; }
function semGpsPermitido(){ const c=cfgInclusao();
  return !!(c.permiteInclusaoPontoSemLocalizacao??(S.perfil&&S.perfil.permiteInclusaoPontoSemLocalizacao)); }
function situacaoPerimetro(){
  const c=cfgInclusao(), per=c.perimetrosAutorizados;
  if(!regPonto.coords||!Array.isArray(per)||!per.length) return {fora:false,bloqueia:false};
  const fora=!dentroDoPerimetro(regPonto.coords.latitude,regPonto.coords.longitude,per);
  return {fora, bloqueia:fora&&!!c.somentePerimetrosAutorizados};
}
function desenharRegistro(){
  if(!regPonto) return;
  const r=regPonto, foto=exigeFoto(), per=r.pronto?situacaoPerimetro():{fora:false,bloqueia:false};
  const gps=r.coords
    ? `📍 ${r.endereco?esc(r.endereco):r.coords.latitude.toFixed(5)+', '+r.coords.longitude.toFixed(5)} <small>(±${Math.round(r.coords.precisao)} m)</small>`
    : r.erroGps?`<span style="color:var(--warn)">⚠️ ${esc(r.erroGps)}</span>`:'📍 buscando sua localização…';
  const podeSemGps=semGpsPermitido();
  const bloqueado=!r.pronto||(!r.coords&&!podeSemGps)||(foto&&!r.foto)||per.bloqueia;
  abrirSheetX(`<h3 style="margin:0 0 6px">🕘 Registrar ponto</h3>
    <p class="muted" style="margin:0 0 12px;font-size:13px">Registra agora, na hora do servidor do Secullum.</p>
    <div class="clock"><div class="t" style="font-size:40px">${nowHM()}</div></div>
    <p style="font-size:13px;margin:8px 0">${gps}</p>
    ${per.fora?`<p class="pill ${per.bloqueia?'bad':'warn'}" style="white-space:normal">${per.bloqueia
      ?'Você está fora do perímetro autorizado pela empresa — o registro não é aceito daqui.'
      :'Fora do perímetro da empresa: o registro vai, mas o Secullum marca pra o gestor revisar.'}</p>`:''}
    ${(!r.coords&&r.erroGps&&!podeSemGps)?'<p class="muted" style="font-size:12px">Sua empresa exige localização pra registrar.</p>':''}
    ${foto?`<div class="camBox">${r.foto?`<img src="data:image/jpeg;base64,${r.foto}" alt="">`:'<video id="regVideo" playsinline muted></video>'}</div>
      <div class="row2" style="margin-bottom:10px">
        ${r.foto?'<button class="btn ghost sm" style="width:100%" onclick="refazerFotoRegistro()">Tirar outra</button>'
          :'<button class="btn ghost sm" style="width:100%" onclick="fotoRegistro()">📸 Fotografar</button>'}
        <label class="btn ghost sm" style="width:100%;text-align:center">🖼️ Da galeria
          <input type="file" accept="image/*" capture="user" hidden onchange="fotoArquivoRegistro(this.files[0])"></label>
      </div>
      <p class="muted" style="font-size:12px;margin:0 0 10px">A empresa onde você trabalha pede uma foto junto do registro.</p>`:''}
    <button class="btn" id="regBtn" ${bloqueado?'disabled style="opacity:.55"':''} onclick="confirmarRegistroPonto(this)">${r.pronto?'Registrar agora':'Preparando…'}</button>`);
  if(foto&&!r.foto&&camStream){ const v=$('#regVideo'); if(v){ v.srcObject=camStream; v.play().catch(()=>{}); } }
}
async function ligarCameraRegistro(){
  const v=$('#regVideo'); if(!v) return;
  const tipo=cfgInclusao().tipoCameraCapturaFotoPonto;
  try{ await ligarCamera(v, tipo!==2&&tipo!=='Traseira'); }
  catch(e){ toast('Câmera indisponível — escolha uma foto da galeria.'); }
}
function fotoRegistro(){ const v=$('#regVideo'); if(!v||!camStream) return ligarCameraRegistro();
  regPonto.foto=fotografar(v); fecharCamera(); desenharRegistro(); }
function refazerFotoRegistro(){ regPonto.foto=null; desenharRegistro(); ligarCameraRegistro(); }
async function fotoArquivoRegistro(f){ try{ regPonto.foto=await jpegDeArquivo(f); fecharCamera(); desenharRegistro(); }catch(e){ toast(e.message); } }
async function confirmarRegistroPonto(btn){
  const r=regPonto; if(!r||!r.pronto) return;
  const per=situacaoPerimetro();
  await comBotao(btn,async()=>{
    // formato do incluirPonto online do app oficial; sem dataHora = hora do servidor
    const corpo={ justificativa:null,
      latitude:r.coords?r.coords.latitude:null, longitude:r.coords?r.coords.longitude:null,
      precisao:r.coords?r.coords.precisao:null, endereco:r.endereco,
      foto:r.foto||null, marcacaoOffline:false, viaCentralWeb:false,
      identificacaoDispositivo:idDispositivo(), foraDoPerimetro:per.fora,
      utilizaLocalizacaoFicticia:false, horaFoiModificada:false, fusoFoiModificado:false, atividadeId:null };
    const ok=await tentar(()=>secJson('POST','/IncluirPonto?funcionarioId={funcionarioId}',corpo));
    if(!ok) return;
    regPonto=null; fecharSheetX();
    toast('✓ Ponto registrado às '+nowHM()+'.');
    await sincronizar(false);
  });
}

/* =====================================================================
   MAIS — as telas do menu do app oficial, com as mesmas regras de exibição
   (retornarTelas/verificarExibirTela): some o que a empresa ocultou.
   ===================================================================== */

function telaVisivel(nome){ return !(DPF().telasOcultar||[]).includes(nome); }
function temFuncionalidade(n){ const f=P().funcionalidades; return !Array.isArray(f)||f.includes(n); }
const flag=(k)=>S.perfil?!!S.perfil[k]:true;

function itensMenu(){
  const pessoais=[
    ['indic','📊','Indicadores',telaVisivel('Indicadores')&&DPF().tipoPerfil!==2],
    ['cartao','🗓️','Cartão ponto',telaVisivel('CartaoPonto')],
    ['registrar','🕘','Registrar ponto',telaVisivel('IncluirPonto')&&S.func.podeManual],
    ['ausencia','🩺','Justificar ausência',telaVisivel('JustificarAusencia')],
    ['solic','📨','Solicitações',telaVisivel('Solicitacoes')],
    ['inc','⚠️','Inconsistências',telaVisivel('Inconsistencias')],
    ['assin','✍️','Assinatura do cartão',telaVisivel('AssinaturaDigitalCartaoPonto')&&flag('assinaturaDigitalCartaoPontoHabilitada')],
    ['ferias','🏖️','Férias',telaVisivel('Ferias')&&temFuncionalidade(1)],
    ['arquivos','📁','Arquivos',telaVisivel('Arquivos')&&temFuncionalidade(0)],
    ['notif','🔔','Notificações',true],
  ];
  const gerais=[
    ['dados','👤','Dados cadastrais',telaVisivel('DadosCadastrais')],
    ['senha','🔑','Alterar senha',telaVisivel('AlterarSenha')],
    ['prefs','📧','Preferências do Secullum',telaVisivel('Configuracoes')],
    ['ajuda','🛟','Ajuda',telaVisivel('Ajuda')],
    ['lgpd','📜','Termo LGPD',true],
    ['conta','🗑️','Excluir conta',true],
  ];
  const gestor=!ehGestor()?[]:[
    ['gIndic','📈','Indicadores da equipe',telaVisivel('IndicadoresGerente')],
    ['gCartao','🗂️','Cartão de funcionário',telaVisivel('CartaoPontoGerente')],
    ['gDiario','👥','Ponto diário',telaVisivel('PontoDiario')],
    ['gSolic','✅','Solicitações da equipe',telaVisivel('SolicitacoesGerente')],
    ['gAssin','🖊️','Assinaturas da equipe',telaVisivel('AssinaturaDigitalCartaoPontoGerente')&&flag('assinaturaDigitalGerentes')],
  ];
  return {pessoais:pessoais.filter(i=>i[3]),gerais:gerais.filter(i=>i[3]),gestor:gestor.filter(i=>i[3])};
}
function abrirTela(s){
  if(s==='registrar') return abrirRegistrarPonto();
  if(s==='inc'){ go('hoje'); return carregarInconsistencias(); }   // pendências já vivem na aba Hoje
  view='mais'; sub=s; M[s]=M[s]||{}; render(); window.scrollTo(0,0);
  if(TELAS[s].carregar) recarregar(s);
}
async function recarregar(s){
  const st=M[s]; st.carregando=true; st.erro=null; if(view==='mais'&&sub===s) render();
  try{ await TELAS[s].carregar(st); }catch(e){ st.erro=e.message||String(e); }
  st.carregando=false; if(view==='mais'&&sub===s) render();
}
function viewMais(){
  const wrap=el('<div class="cards"></div>');
  if(sub&&TELAS[sub]){
    wrap.appendChild(el(`<button class="voltar" onclick="go('mais')">← ${esc(TELAS[sub].titulo)}</button>`));
    wrap.appendChild(el(`<div class="card">${TELAS[sub].render(M[sub])}</div>`));
    return wrap;
  }
  const {pessoais,gerais,gestor}=itensMenu();
  const grade=(lista)=>`<div class="menuGrid">${lista.map(([k,ic,nome])=>
    `<button onclick="abrirTela('${k}')"><i>${ic}</i>${nome}</button>`).join('')}</div>`;
  if(gestor.length) wrap.appendChild(el(`<div class="card"><h3>Dados gerenciais</h3>${grade(gestor)}</div>`));
  wrap.appendChild(el(`<div class="card"><h3>Dados pessoais</h3>${grade(pessoais)}</div>`));
  wrap.appendChild(el(`<div class="card"><h3>Conta</h3>${grade(gerais)}</div>`));
  return wrap;
}
const carga=(st)=>st.carregando?'<p class="muted" style="margin:0 0 10px">Carregando do Secullum…</p>'
  :st.erro?`<p style="color:var(--warn);margin:0 0 10px">⚠️ ${esc(st.erro)}</p>`:'';
const vazio=(st,txt)=>(!st.carregando&&!st.erro)?`<p class="muted" style="margin:0">${txt}</p>`:'';
function filtroPeriodo(s,st){
  return `<div class="filtros" style="margin-bottom:12px">
    <div class="field"><label>De</label><input type="date" id="f_ini" value="${st.ini}"></div>
    <div class="field"><label>Até</label><input type="date" id="f_fim" value="${st.fim}"></div>
    <button class="btn sm" onclick="M['${s}'].ini=$('#f_ini').value;M['${s}'].fim=$('#f_fim').value;recarregar('${s}')">Buscar</button>
  </div>`;
}
function filtroStatus(s,st,opcoes){
  return `<div class="field"><label>Mostrar</label><select onchange="M['${s}'].status=+this.value;recarregar('${s}')">
    ${opcoes.map(([v,n])=>`<option value="${v}" ${st.status===v?'selected':''}>${n}</option>`).join('')}</select></div>`;
}
// coordenada pra assinatura: o app oficial manda a posição junto do aceite
async function coordsAssinatura(){
  try{ const c=await posicaoAtual(); return {...c, endereco:await enderecoDe(c)}; }
  catch(e){ return {latitude:null,longitude:null,precisao:null,endereco:null}; }
}
function pedirSenhaOuMotivo({titulo,texto,rotulo,tipo='text',acao}){

// o app confere a senha antes de mandar; aqui só dá pra conferir se ela ficou salva
function senhaConfere(v){
  if(!v) return toast('Digite sua senha.'),false;
  let salva=''; try{ salva=S.auth.senha?atob(S.auth.senha):''; }catch(e){}
  if(salva&&v!==salva) return toast('Senha inválida.'),false;
  return true;
}
