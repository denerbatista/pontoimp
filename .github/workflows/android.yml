name: APK Android

# Build sob demanda e a cada mudança no app nativo. O APK sai como artefato
# do run — não há publicação em loja, a instalação é direta no aparelho.
on:
  push:
    branches: ["**"]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # sem gradle-wrapper no repo: o SDK do Android não é alcançável no ambiente
      # onde este projeto foi escrito, então a versão é fixada aqui
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Compilar APK de debug
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Publicar o APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: pontoimp-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
