name: APK Android

# Build sob demanda e a cada mudança no app nativo. O APK sai como artefato
# do run — não há publicação em loja, a instalação é direta no aparelho.
on:
  push:
    branches: ["**"]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # publicar a release com o APK
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # sem gradle-wrapper no repo: o SDK do Android não é alcançável no ambiente
      # onde este projeto foi escrito, então a versão é fixada aqui
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      # Sem chave fixa, cada build sai com assinatura diferente e o Android
      # recusa a atualização por conflito. Se o secret não existir, o build
      # continua funcionando com a chave de debug do runner — só não atualiza.
      - name: Chave de assinatura
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > android/app/pontoimp.jks
            echo "Chave própria aplicada ($(stat -c%s android/app/pontoimp.jks) bytes)."
          else
            echo "::warning::ANDROID_KEYSTORE não configurado — o APK sairá com assinatura instável e não atualizará por cima do anterior."
          fi

      - name: Compilar APK de debug
        working-directory: android
        env:
          # o versionCode passa a ser o número do run, igual à tag apk-N da
          # release — é a comparação que o atualizador do app faz
          RUN_NUMBER: ${{ github.run_number }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Publicar o APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: pontoimp-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # O artefato acima baixa como .zip e exige login no GitHub — no celular
      # isso não instala. A release dá um link direto pro .apk, sem login.
      - name: Renomear com a versão do build
        run: |
          cd android/app/build/outputs/apk/debug
          mv app-debug.apk "pontoimp-${{ github.run_number }}.apk"

      - name: Publicar release com link direto
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: PontoImp APK ${{ github.run_number }}
          body: |
            APK do PontoImp — instale direto no celular.

            Baixe o `.apk` abaixo pelo próprio navegador do aparelho. O Android
            vai pedir permissão para instalar de fonte desconhecida; é o esperado
            para app fora da Play Store.
          files: android/app/build/outputs/apk/debug/pontoimp-*.apk
          make_latest: true
